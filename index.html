  // ---------- stats view ----------
  function withinDays(s, n){
    var d = new Date(s.date + 'T00:00:00');
    var cutoff = new Date(); cutoff.setDate(cutoff.getDate() - n); cutoff.setHours(0,0,0,0);
    return d >= cutoff;
  }
  function withinThisMonth(s){
    var d = new Date(s.date + 'T00:00:00');
    var now = new Date();
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }

  function renderStats(){
    renderWeekBar();
    var container = document.getElementById('statsCards');
    container.innerHTML = '';

    // Padel
    var padel = sessions.filter(function(s){ return s.type==='padel'; });
    var padelMonth = padel.filter(withinThisMonth);
    var matchesMonth = padelMonth.filter(function(s){ return !s.padelType || s.padelType==='match'; });
    var wins = matchesMonth.filter(function(s){ return s.result==='win'; }).length;
    var winRate = matchesMonth.length ? Math.round(100*wins/matchesMonth.length) : 0;
    container.appendChild(statCard('padel', [
      { val: padelMonth.length, lbl: 'Sessions this month' },
      { val: matchesMonth.length ? winRate + '%' : '—', lbl: 'Match win rate' }
    ]));

    // Gym
    var gym = sessions.filter(function(s){ return s.type==='resistance'; });
    var gymWeek = gym.filter(function(s){ return withinDays(s,7); });
    var lastBw = gym.find(function(s){ return s.bodyweight; });
    container.appendChild(statCard('resistance', [
      { val: gymWeek.length, lbl: 'Sessions this week' },
      { val: lastBw && lastBw.bodyweight ? lastBw.bodyweight + 'kg' : '—', lbl: 'Last logged bodyweight' }
    ]));

    // Cardio
    var cardio = sessions.filter(function(s){ return s.type==='cardio'; });
    var cardioMonth = cardio.filter(withinThisMonth);
    var totalCardioMin = cardioMonth.reduce(function(a,s){ return a + (s.durationMin||0); }, 0);
    container.appendChild(statCard('cardio', [
      { val: cardioMonth.length, lbl: 'Sessions this month' },
      { val: totalCardioMin || 0, lbl: 'Minutes this month' }
    ]));

    // Yoga
    var yoga = sessions.filter(function(s){ return s.type==='yoga'; });
    var yogaWeek = yoga.filter(function(s){ return withinDays(s,7); });
    container.appendChild(statCard('yoga', [
      { val: yogaWeek.length, lbl: 'Sessions this week' },
      { val: yoga.length, lbl: 'All-time sessions' }
    ]));

    // Weight (merges dedicated weight logs + bodyweight noted in gym sessions)
    var weightEntries = sessions
      .filter(function(s){ return (s.type==='weight' && s.weightKg) || (s.type==='resistance' && s.bodyweight); })
      .map(function(s){ return { date: s.date, val: s.type==='weight' ? s.weightKg : s.bodyweight }; })
      .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var latestWeight = weightEntries.length ? weightEntries[weightEntries.length-1].val : null;
    var weightCard = statCard('weight', [
      { val: latestWeight != null ? latestWeight + 'kg' : '—', lbl: 'Latest weight' },
      { val: weightEntries.length, lbl: 'Entries logged' }
    ]);
    if (weightEntries.length > 1){
      var sparkWrap = document.createElement('div');
      sparkWrap.innerHTML = sparklineSvg(weightEntries.slice(-14).map(function(e){ return e.val; }), getComputedStyle(document.documentElement).getPropertyValue('--weight').trim());
      weightCard.appendChild(sparkWrap.firstChild);
    }
    container.appendChild(weightCard);

    // Photos
    var photos = sessions.filter(function(s){ return s.type==='photo'; });
    var photosMonth = photos.filter(withinThisMonth);
    container.appendChild(statCard('photo', [
      { val: photosMonth.length, lbl: 'Photos this month' },
      { val: photos.length, lbl: 'All-time photos' }
    ]));

    // Nutrition
    var nutrition = sessions.filter(function(s){ return s.type==='nutrition'; });
    var nutritionMonth = nutrition.filter(withinThisMonth);
    var goodDays = nutritionMonth.filter(function(s){ return s.dayRating==='good'; }).length;
    var gfDays = nutritionMonth.filter(function(s){ return s.glutenFree; }).length;
    var hydratedDays = nutritionMonth.filter(function(s){ return s.sufficientWater; }).length;
    container.appendChild(statCard('nutrition', [
      { val: goodDays, lbl: 'On-track days this month' },
      { val: gfDays, lbl: 'Gluten-free days' },
      { val: hydratedDays, lbl: 'Hydrated days' }
    ]));

    // Gluten exposure — now tracked within Nutrition; factual tally only, no inferred causation
    var glutenMonth = nutritionMonth.filter(function(s){ return s.glutenExposure; });
    var symptomCounts = {};
    glutenMonth.forEach(function(s){

    Object.keys(symptomCounts).forEach(function(sym){

    });
    container.appendChild(statCard('gluten', [
      { val: glutenMonth.length, lbl: 'Exposures logged this month' },
      { val: topSymptom, lbl: 'Most common symptom' }
    ]));

  function sparklineSvg(values, color){
    if (!values.length) return '';
    var w = 200, h = 36, pad = 3;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var range = (max - min) || 1;
    var step = values.length > 1 ? (w - pad*2) / (values.length - 1) : 0;
    var points = values.map(function(v, i){
      var x = pad + i*step;
      var y = h - pad - ((v - min) / range) * (h - pad*2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg class="sparkline" viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="36" preserveAspectRatio="none">' +
      '<polyline points="' + points + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }

  function renderWeeklyBarChart(entries, color){
    // entries: array of {date} — buckets into the last 8 calendar weeks (Sun-Sat)
    var now = new Date();
    var weekStart = new Date(now); weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    var buckets = [];
    for (var i=7; i>=0; i--){
      var start = new Date(weekStart); start.setDate(start.getDate() - i*7);
      var end = new Date(start); end.setDate(end.getDate() + 7);
      buckets.push({ start: start, end: end, count: 0 });
    }
    entries.forEach(function(e){
      var d = new Date(e.date + 'T00:00:00');
      buckets.forEach(function(b){ if (d >= b.start && d < b.end) b.count++; });
    });
    var maxCount = Math.max.apply(null, buckets.map(function(b){ return b.count; }).concat([1]));

    var wrap = document.createElement('div');
    wrap.className = 'weekbar';
    var bars = document.createElement('div');
    bars.className = 'weekbar-bars';
    bars.style.height = '110px';
    buckets.forEach(function(b){
      var col = document.createElement('div');
      col.className = 'weekbar-col';
      var stack = document.createElement('div');
      stack.className = 'weekbar-stack';
      var h = (b.count / maxCount) * 90;
      stack.style.height = Math.max(h, b.count ? 10 : 0) + 'px';
      if (b.count){
        var seg = document.createElement('div');
        seg.style.width = '100%';
        seg.style.height = '100%';
        seg.style.borderRadius = '4px';
        seg.style.background = color;
        stack.appendChild(seg);
      }
      col.appendChild(stack);
      var lbl = document.createElement('div');
      lbl.className = 'weekbar-day';
      lbl.textContent = b.start.toLocaleDateString(undefined,{day:'numeric',month:'short'});
      col.appendChild(lbl);
      bars.appendChild(col);
    });
    wrap.appendChild(bars);
    return wrap;
  }

  function bigLineChartSvg(values, color){
    if (!values.length) return document.createElement('div');
    var w = 320, h = 120, pad = 10;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var range = (max - min) || 1;
    var step = values.length > 1 ? (w - pad*2) / (values.length - 1) : 0;
    var points = values.map(function(v, i){
      var x = pad + i*step;
      var y = h - pad - ((v - min) / range) * (h - pad*2);
      return { x: x, y: y };
    });
    var polyStr = points.map(function(p){ return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var dotsStr = points.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="'+color+'"/>'; }).join('');
    var wrap = document.createElement('div');
    wrap.className = 'detail-chart-wrap';
    wrap.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polyline points="' + polyStr + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      dotsStr +
      '</svg>';
    return wrap;
  }

  // ---------- gamification (player card) ----------
  var LEVEL_TIERS = [
    { min: 1,  max: 2,  color: '#8c8171', name: 'Rookie' },
    { min: 3,  max: 5,  color: '#b99669', name: 'Grinder' },
    { min: 6,  max: 9,  color: '#c6a15c', name: 'Contender' },
    { min: 10, max: 14, color: '#4c8c86', name: 'Competitor' },
    { min: 15, max: 20, color: '#8b7a8f', name: 'Veteran' },
    { min: 21, max: Infinity, color: '#a85c48', name: 'Elite' }
  ];
  function computeXP(){
    var sessionXP = sessions.length * 10;
    var focusXP = focusItems.filter(function(f){ return f.done; }).length * 25;
    return sessionXP + focusXP;
  }

  function computeLevelInfo(xp){
    var level = 1, threshold = 100, remaining = xp;
    while (remaining >= threshold){
      remaining -= threshold;
      level++;
      threshold = level * 100;
    }
    return { level: level, into: remaining, needed: threshold };
  }

  function tierFor(level){
    for (var i=0; i<LEVEL_TIERS.length; i++){
      if (level >= LEVEL_TIERS[i].min && level <= LEVEL_TIERS[i].max) return LEVEL_TIERS[i];
    }
    return LEVEL_TIERS[LEVEL_TIERS.length-1];
  }

  function computeStreak(){
    var uniqueDays = {};
    sessions.forEach(function(s){ uniqueDays[s.date] = true; });
    var streak = 0;
    var cursor = new Date();
    // if nothing logged today yet, streak can still count from yesterday backward
    if (!uniqueDays[fmtDate(cursor)]) cursor.setDate(cursor.getDate() - 1);
    while (uniqueDays[fmtDate(cursor)]){
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function openPlanSheet(dateStr, existing){
    editingId = null;
    var p = existing || {};
    var d = new Date(dateStr + 'T00:00:00');
    var restDay = !!p.restDay;
    var trainingTypes = (p.trainingTypes || []).slice();
    var carbLevel = p.carbLevel || null;
    var fasting = !!p.fasting;
    var mealsState = (p.meals && p.meals.length) ? p.meals.slice() : [''];

    function buildHtml(){
      var html = '<div class="sheet-handle"></div>' +
        '<div class="sheet-head"><div class="sheet-title">' + niceDate(d) + '</div><button class="sheet-close" id="sheetCloseBtn">✕</button></div>' +
        '<button type="button" class="rest-day-toggle' + (restDay ? ' sel' : '') + '" id="restDayToggle">' + (restDay ? '✓ Rest day' : 'Mark as rest day') + '</button>' +
        '<div id="trainingSection" style="' + (restDay ? 'display:none' : '') + '">' +
          '<div class="field"><label>Training planned</label><div class="type-chip-grid" id="planTypeGrid">' +
            PLAN_TRAINING_TYPES.map(function(t){
              var color = getComputedStyle(document.documentElement).getPropertyValue('--' + t).trim();
              var isSel = trainingTypes.indexOf(t) > -1;
              var style = isSel
                ? 'background:'+hexToRgba(color,0.16)+';border-color:'+color+';color:var(--text);'
                : 'background:'+hexToRgba(color,0.08)+';border-color:'+hexToRgba(color,0.25)+';';
              return '<button type="button" class="type-chip-btn' + (isSel ? ' sel':'') + '" data-t="' + t + '" style="'+style+'">' +
                '<span class="dot ' + t + '"></span>' + TYPE_LABEL[t] + '</button>';
            }).join('') +
          '</div></div>' +
        '</div>' +
        fieldSelect('f_carbLevel', 'Diet', [{value:'',label:'Not set'}].concat(Object.keys(CARB_LEVEL_LABEL).map(function(k){ return {value:k,label:CARB_LEVEL_LABEL[k]}; })), carbLevel || '') +
        fieldYesNo('f_fasting', 'Fasting', fasting) +
        '<div class="field"><label>Meals planned for this day</label><div id="planMealRows"></div>' +
          '<button type="button" class="add-exercise-btn" id="addPlanMealBtn">+ Add meal</button></div>' +
        '<div class="field"><label>Roadblocks / things that might derail this (optional)</label><textarea id="f_roadblocks" placeholder="e.g. work dinner, travel day">' + (p.roadblocks||'') + '</textarea></div>' +
        '<button class="save-btn" id="savePlanBtn">Save plan</button>' +
        (existing ? '<button class="delete-btn" id="deletePlanBtn">Clear plan</button>' : '');
      return html;
    }

    sheetEl.innerHTML = buildHtml();
    backdrop.classList.add('open');
    wireSheet();

    function renderMealRows(){
      var wrap = document.getElementById('planMealRows');
      wrap.innerHTML = '';
      mealsState.forEach(function(text, i){
        var row = document.createElement('div');
        row.className = 'simple-row';
        row.innerHTML =
          '<input placeholder="…" value="'+(text||'').replace(/"/g,'&quot;')+'">' +
          '<button type="button" class="ex-rm">✕</button>';
        var input = row.querySelector('input');
        input.addEventListener('input', function(){ mealsState[i] = input.value; });
        row.querySelector('.ex-rm').addEventListener('click', function(){
          mealsState.splice(i,1);
          if (!mealsState.length) mealsState.push('');
          renderMealRows();
        });
        wrap.appendChild(row);
      });
    }

    function wireSheet(){
      document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);
      document.getElementById('restDayToggle').addEventListener('click', function(){
        restDay = !restDay;
        sheetEl.innerHTML = buildHtml();
        wireSheet();
      });
      document.querySelectorAll('#planTypeGrid .type-chip-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var t = btn.dataset.t;
          var idx = trainingTypes.indexOf(t);
          var willBeSel = idx === -1;
          if (idx > -1) trainingTypes.splice(idx,1); else trainingTypes.push(t);
          btn.classList.toggle('sel');
          var color = getComputedStyle(document.documentElement).getPropertyValue('--' + t).trim();
          if (willBeSel){
            btn.style.background = hexToRgba(color, 0.16);
            btn.style.borderColor = color;
            btn.style.color = '';
          } else {
            btn.style.background = hexToRgba(color, 0.08);
            btn.style.borderColor = hexToRgba(color, 0.25);
            btn.style.color = '';
          }
        });
      });
      document.querySelectorAll('#f_fastingToggle button').forEach(function(b){
        b.addEventListener('click', function(){
          fasting = (b.dataset.v === 'yes');
          document.querySelectorAll('#f_fastingToggle button').forEach(function(x){ x.classList.remove('sel'); });
          b.classList.add('sel');
        });
      });
      renderMealRows();
      document.getElementById('addPlanMealBtn').addEventListener('click', function(){
        mealsState.push('');
        renderMealRows();
      });
      document.getElementById('savePlanBtn').addEventListener('click', function(){
        var data = {
          restDay: restDay,
          trainingTypes: restDay ? [] : trainingTypes,
          carbLevel: document.getElementById('f_carbLevel').value || null,
          fasting: fasting,
          meals: mealsState.map(function(t){ return t.trim(); }).filter(Boolean),
          roadblocks: document.getElementById('f_roadblocks').value
        };
        savePlanForDate(dateStr, data);
        closeSheet();
      });
      if (existing){
        document.getElementById('deletePlanBtn').addEventListener('click', function(){
          deletePlanForDate(dateStr);
          closeSheet();
        });
      }
    }
  }

      .filter(function(s){ return (s.type==='weight' && s.weightKg) || (s.type==='resistance' && s.bodyweight); })
      .map(function(s){ return { date: s.date, val: s.type==='weight' ? s.weightKg : s.bodyweight }; })
      .sort(function(a,b){ return a.date < b.date ? -1 : 1; });

  function fieldNum(id, label, value, placeholder, step){

      html += fieldText('f_waterAmount', 'Approx. amount (optional)', d.waterAmount, 'e.g. 2L or 6 glasses');
      html += fieldYesNo('f_glutenExposure', 'Suspected gluten exposure today', d.glutenExposure);
      html += '<div id="glutenExposureFields" style="' + (d.glutenExposure ? '' : 'display:none') + '">' +
        fieldText('f_glutenSource', 'Suspected source', d.glutenSource, 'e.g. soy sauce at dinner') +
        '<div class="field"><label>Symptoms</label><div class="type-chip-grid" id="glutenSymptomGrid" style="grid-template-columns:repeat(2,1fr)">' +
          GLUTEN_SYMPTOMS.map(function(s){
            var isSel = d.glutenSymptoms && d.glutenSymptoms.indexOf(s) > -1;
            var glutenColor = getComputedStyle(document.documentElement).getPropertyValue('--gluten').trim();
            var style = isSel ? 'background:'+glutenColor+';border-color:'+glutenColor+';color:#2a120c;' : '';
            return '<button type="button" class="type-chip-btn'+(isSel?' sel':'')+'" data-s="'+s+'" style="'+style+'">'+s+'</button>';
          }).join('') +
        '</div></div>' +
        '<div class="field"><label>Severity</label><div class="seg-toggle" id="glutenSeverityToggle">' +
          '<button data-v="mild" class="'+(d.glutenSeverity==='mild'?'sel':'')+'">Mild</button>' +
          '<button data-v="moderate" class="'+(d.glutenSeverity==='moderate'?'sel':'')+'">Moderate</button>' +
          '<button data-v="severe" class="'+(d.glutenSeverity==='severe'?'sel':'')+'">Severe</button>' +
          '</div></div>' +
        fieldText('f_glutenRecovery', 'Recovery time (optional)', d.glutenRecovery, 'e.g. 1 day') +
      '</div>';
      html += '<div class="field"><label>Food diary (optional)</label><textarea id="f_foodDiary" placeholder="What did you eat today">'+(d.foodDiary||'')+'</textarea></div>';
      html += fieldNum('f_calories', 'Calories (optional)', d.calories, '2200');
    }

    if (type !== 'nutrition') html += fieldNotes(d.notes);
    html += '<button class="save-btn" id="saveBtn">Save</button>';
    if (editingId) html += '<button class="delete-btn" id="deleteBtn">Delete</button>';
    return html;
  }

  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if (h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function wireForm(type, d){
    document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);

    document.getElementById('setNowTimeBtn').addEventListener('click', function(){
      var now = new Date();
      var hh = String(now.getHours()).padStart(2,'0');
      var mm = String(now.getMinutes()).padStart(2,'0');
      document.getElementById('f_activityTime').value = hh + ':' + mm;
    });

    var exerciseState = (d.exercises && d.exercises.length) ? d.exercises.slice() : (type==='resistance' ? [{name:'',sets:'',reps:'',value:'',unit:'kg'}] : []);
    var pendingPhotoDataUrl = d.photoDataUrl || null;

    if (type === 'padel'){
      var resultVal = d.result || null;
      document.querySelectorAll('#resultToggle button').forEach(function(b){
        b.addEventListener('click', function(){
          resultVal = (resultVal === b.dataset.v) ? null : b.dataset.v;
          document.querySelectorAll('#resultToggle button').forEach(function(x){ x.classList.remove('sel'); });
          if (resultVal) b.classList.add('sel');
        });
      });

      var setState = (d.sets && d.sets.length) ? d.sets.slice() : [{yourGames:'', oppGames:''}];
      var setRowsWrap = document.getElementById('setRows');
      function renderSetRows(){
        setRowsWrap.innerHTML = '';
        setState.forEach(function(st, i){
          var row = document.createElement('div');
          row.className = 'exercise-row';
          row.innerHTML =
            '<input placeholder="Your games" type="number" value="'+(st.yourGames!=null?st.yourGames:'')+'">' +
            '<input placeholder="Opp. games" type="number" value="'+(st.oppGames!=null?st.oppGames:'')+'">' +
            '<button type="button" class="ex-rm">✕</button>';
          var ins = row.querySelectorAll('input');
          ins[0].addEventListener('input', function(){ setState[i].yourGames = ins[0].value; });
          ins[1].addEventListener('input', function(){ setState[i].oppGames = ins[1].value; });
          row.querySelector('.ex-rm').addEventListener('click', function(){ setState.splice(i,1); renderSetRows(); });
          setRowsWrap.appendChild(row);
        });
      }
      renderSetRows();
      document.getElementById('addSetBtn').addEventListener('click', function(){
        setState.push({yourGames:'', oppGames:''});
        renderSetRows();
      });

      var padelTypeSelect = document.getElementById('f_padelType');
      var matchFieldsWrap = document.getElementById('padelMatchFields');
      var playersFieldsWrap = document.getElementById('playersFieldsWrap');
      var addPlayersBtn = document.getElementById('addPlayersBtn');
      var hasPlayers = d.players && d.players.filter(Boolean).length > 0;
      var playersRevealed = hasPlayers; // true only if editing an entry that already has player names
      function syncPadelTypeVisibility(){
        var isMatch = padelTypeSelect.value === 'match';
        matchFieldsWrap.style.display = isMatch ? '' : 'none';
        var showPlayers = isMatch || playersRevealed;
        playersFieldsWrap.style.display = showPlayers ? '' : 'none';
        addPlayersBtn.style.display = showPlayers ? 'none' : '';
      }
      addPlayersBtn.addEventListener('click', function(){
        playersRevealed = true;
        syncPadelTypeVisibility();
      });
      padelTypeSelect.addEventListener('change', syncPadelTypeVisibility);
      syncPadelTypeVisibility();
    }

    if (type === 'nutrition'){
      var dayRatingVal = d.dayRating || null;
      document.querySelectorAll('#dayRatingToggle button').forEach(function(b){
        b.addEventListener('click', function(){
          dayRatingVal = (dayRatingVal === b.dataset.v) ? null : b.dataset.v;
          document.querySelectorAll('#dayRatingToggle button').forEach(function(x){ x.classList.remove('sel'); });
          if (dayRatingVal) b.classList.add('sel');
        });
      });

      var glutenFreeVal = !!d.glutenFree;
      var minimalProcessedVal = !!d.minimalProcessed;
      var sufficientWaterVal = !!d.sufficientWater;
      var glutenExposureVal = !!d.glutenExposure;
      var glutenSymptomsState = (d.glutenSymptoms || []).slice();
      var glutenSeverityVal = d.glutenSeverity || null;
      function wireYesNo(idPrefix, getSet){
        document.querySelectorAll('#' + idPrefix + 'Toggle button').forEach(function(b){
          b.addEventListener('click', function(){
            getSet(b.dataset.v === 'yes');
            document.querySelectorAll('#' + idPrefix + 'Toggle button').forEach(function(x){ x.classList.remove('sel'); });
            b.classList.add('sel');
          });
        });
      }
      wireYesNo('f_glutenFree', function(v){ glutenFreeVal = v; });
      wireYesNo('f_minimalProcessed', function(v){ minimalProcessedVal = v; });
      wireYesNo('f_sufficientWater', function(v){ sufficientWaterVal = v; });

      var glutenExposureFieldsWrap = document.getElementById('glutenExposureFields');
      wireYesNo('f_glutenExposure', function(v){
        glutenExposureVal = v;
        glutenExposureFieldsWrap.style.display = v ? '' : 'none';
      });

      var glutenColor = getComputedStyle(document.documentElement).getPropertyValue('--gluten').trim();
      document.querySelectorAll('#glutenSymptomGrid .type-chip-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var s = btn.dataset.s;
          var idx = glutenSymptomsState.indexOf(s);
          var willBeSel = idx === -1;
          if (idx > -1) glutenSymptomsState.splice(idx,1); else glutenSymptomsState.push(s);
          btn.classList.toggle('sel');
          if (willBeSel){
            btn.style.background = glutenColor;
            btn.style.borderColor = glutenColor;
            btn.style.color = '#2a120c';
          } else {
            btn.style.background = '';
            btn.style.borderColor = '';
            btn.style.color = '';
          }
        });
      });
      document.querySelectorAll('#glutenSeverityToggle button').forEach(function(b){
        b.addEventListener('click', function(){
          glutenSeverityVal = (glutenSeverityVal === b.dataset.v) ? null : b.dataset.v;
          document.querySelectorAll('#glutenSeverityToggle button').forEach(function(x){ x.classList.remove('sel'); });
          if (glutenSeverityVal) b.classList.add('sel');
        });
      });
    }

    if (type === 'cardio'){
      var typeSelect = document.getElementById('f_cardioType');
      var newTypeField = document.getElementById('cardioNewTypeField');
      function syncNewTypeVisibility(){
        newTypeField.style.display = (typeSelect.value === '__new__') ? '' : 'none';
      }
      typeSelect.addEventListener('change', syncNewTypeVisibility);
      syncNewTypeVisibility();
    }

    if (type === 'resistance'){
      var rowsWrap = document.getElementById('exerciseRows');
      var dlId = 'exerciseSuggestions';
      if (!document.getElementById(dlId)){
        var dl = document.createElement('datalist');
        dl.id = dlId;
        document.body.appendChild(dl);
      }
      var dlEl = document.getElementById(dlId);
      dlEl.innerHTML = presets.exercises.map(function(e){ return '<option value="'+e.name.replace(/"/g,'&quot;')+'">'; }).join('');

      function renderRows(){
        rowsWrap.innerHTML = '';
        exerciseState.forEach(function(ex, i){
          var row = document.createElement('div');
          row.className = 'exercise-row';
          var unitOptsHtml = UNIT_OPTIONS.map(function(u){ return '<option value="'+u+'"'+(ex.unit===u?' selected':'')+'>'+u+'</option>'; }).join('');
          row.innerHTML =
            '<input class="ex-name" list="'+dlId+'" placeholder="Exercise name" value="'+(ex.name||'').replace(/"/g,'&quot;')+'">' +
            '<input placeholder="Sets" type="number" value="'+(ex.sets||'')+'" style="max-width:56px">' +
            '<input placeholder="Reps" type="number" value="'+(ex.reps||'')+'" style="max-width:56px">' +
            '<input placeholder="Value" type="number" value="'+(ex.value||'')+'" style="max-width:64px">' +
            '<select class="ex-unit">'+unitOptsHtml+'</select>' +
            '<button type="button" class="ex-rm">✕</button>';
          var inputs = row.querySelectorAll('input');
          inputs[0].addEventListener('input', function(){ exerciseState[i].name = inputs[0].value; });
          inputs[1].addEventListener('input', function(){ exerciseState[i].sets = inputs[1].value; });
          inputs[2].addEventListener('input', function(){ exerciseState[i].reps = inputs[2].value; });
          inputs[3].addEventListener('input', function(){ exerciseState[i].value = inputs[3].value; });
          row.querySelector('.ex-unit').addEventListener('change', function(e){ exerciseState[i].unit = e.target.value; });
          row.querySelector('.ex-rm').addEventListener('click', function(){
            exerciseState.splice(i,1); renderRows();
          });
          rowsWrap.appendChild(row);
        });
      }
      renderRows();
      document.getElementById('addExerciseBtn').addEventListener('click', function(){
        exerciseState.push({name:'',sets:'',reps:'',value:'',unit:'kg'});
        renderRows();
      });
    }

    if (type === 'photo'){
      function handlePhotoFile(e){
        var file = e.target.files[0];
        if (!file) return;
        compressImage(file, 900, 0.65).then(function(dataUrl){
          pendingPhotoDataUrl = dataUrl;
          var wrap = document.getElementById('photoPreviewWrap');
          document.getElementById('photoPreviewImg').src = dataUrl;
          wrap.style.display = '';
        }).catch(function(err){ console.error('photo compress failed', err); });
      }
      document.getElementById('f_photoCamera').addEventListener('change', handlePhotoFile);
      document.getElementById('f_photoGallery').addEventListener('change', handlePhotoFile);
      document.getElementById('takePhotoBtn').addEventListener('click', function(){
        document.getElementById('f_photoCamera').click();
      });
      document.getElementById('choosePhotoBtn').addEventListener('click', function(){
        document.getElementById('f_photoGallery').click();
      });
    }

    document.getElementById('saveBtn').addEventListener('click', function(){
      var out = { type: type, date: document.getElementById('f_date').value || todayStr() };
      if (editingId) out.id = editingId;
      out.createdAt = (d.createdAt) || new Date().toISOString();
      var notesEl = document.getElementById('f_notes');
      out.notes = notesEl ? notesEl.value : '';
      out.activityTime = document.getElementById('f_activityTime').value;

      if (type === 'padel'){
        out.padelType = document.getElementById('f_padelType').value;
        if (out.padelType === 'match'){
          out.result = typeof resultVal !== 'undefined' ? resultVal : (d.result || null);
          out.sets = setState
            .filter(function(st){ return st.yourGames !== '' || st.oppGames !== ''; })
            .map(function(st){ return { yourGames: st.yourGames !== '' ? Number(st.yourGames) : null, oppGames: st.oppGames !== '' ? Number(st.oppGames) : null }; });
        } else {
          out.result = null;
          out.sets = [];
        }
        out.players = [
          document.getElementById('f_player1').value,
          document.getElementById('f_player2').value,
          document.getElementById('f_player3').value,
          document.getElementById('f_player4').value
        ];
        out.venue = document.getElementById('f_venue').value;
        out.durationMin = numOrNull('f_durationMin');
      }
      if (type === 'resistance'){
        var finalExercises = exerciseState.filter(function(e){ return e.name; }).map(function(e){
          return { name: e.name, sets: e.sets ? Number(e.sets) : null, reps: e.reps ? Number(e.reps) : null,
                   value: e.value ? Number(e.value) : null, unit: e.unit || 'kg' };
        });
        out.exercises = finalExercises;
        out.bodyweight = numOrNull('f_bodyweight');
        out.durationMin = numOrNull('f_durationMin');

        // Offer to save any new exercise names as presets
        var knownNames = presets.exercises.map(function(e){ return e.name.toLowerCase(); });
        var newOnes = finalExercises.filter(function(e){ return knownNames.indexOf(e.name.toLowerCase()) === -1; });
        newOnes.forEach(function(e){
          if (confirm('Save "' + e.name + '" (' + e.unit + ') as a new exercise for quick access next time?')){
            presets.exercises.push({ name: e.name, unit: e.unit });
            knownNames.push(e.name.toLowerCase());
          }
        });
        if (newOnes.length) savePresets();
      }
      if (type === 'cardio'){
        var typeSelectEl = document.getElementById('f_cardioType');
        var chosenType = typeSelectEl.value;
        if (chosenType === '__new__'){
          var newName = document.getElementById('f_cardioTypeNew').value.trim();
          if (newName){
            chosenType = newName;
            if (presets.cardioTypes.indexOf(newName) === -1 &&
                confirm('Save "' + newName + '" as a new cardio type for quick access?')){
              presets.cardioTypes.push(newName);
              savePresets();
            }
          } else {
            chosenType = presets.cardioTypes[0];
          }
        }
        out.cardioType = chosenType;
        out.distance = numOrNull('f_distance');
        out.distanceUnit = document.getElementById('f_distanceUnit').value;
        out.durationMin = numOrNull('f_durationMin');
      }
      if (type === 'yoga'){
        out.focus = document.getElementById('f_focus').value;
        out.durationMin = numOrNull('f_durationMin');
      }
      if (type === 'weight'){
        out.weightKg = numOrNull('f_weightKg');
      }
      if (type === 'photo'){
        out.photoDataUrl = pendingPhotoDataUrl || d.photoDataUrl || null;
      }
      if (type === 'nutrition'){
        out.dayRating = typeof dayRatingVal !== 'undefined' ? dayRatingVal : (d.dayRating || null);
        out.glutenFree = glutenFreeVal;
        out.minimalProcessed = minimalProcessedVal;
        out.sufficientWater = sufficientWaterVal;
        out.waterAmount = document.getElementById('f_waterAmount').value;
        out.foodDiary = document.getElementById('f_foodDiary').value;
        out.calories = numOrNull('f_calories');
        out.glutenExposure = glutenExposureVal;
        if (glutenExposureVal){
          out.glutenSource = document.getElementById('f_glutenSource').value;
          out.glutenSymptoms = glutenSymptomsState.slice();
          out.glutenSeverity = typeof glutenSeverityVal !== 'undefined' ? glutenSeverityVal : (d.glutenSeverity || null);
          out.glutenRecovery = document.getElementById('f_glutenRecovery').value;
        } else {
          out.glutenSource = '';
          out.glutenSymptoms = [];
          out.glutenSeverity = null;
          out.glutenRecovery = '';
        }
      }

      saveSession(out);
      closeSheet();
    });

    if (editingId){
      document.getElementById('deleteBtn').addEventListener('click', function(){
        deleteSession(editingId);
        closeSheet();
      });
    }
  }

  function numOrNull(id){
    var el = document.getElementById(id);
    if (!el || el.value === '') return null;
    return Number(el.value);
  }

  // ---------- render orchestration ----------
  function renderAll(){
    renderHeader();
    renderLogView();
    if (currentView === 'calendar') renderCalendar();
    if (currentView === 'stats') renderStats();
    if (currentView === 'focus') renderFocus();
    if (currentView === 'plan') renderPlan();
  }

  renderHeader();
  renderAll();
  initDb();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW registration failed', e); });
    });
  }

})();
</script>
