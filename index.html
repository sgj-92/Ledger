<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#14171a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ledger — Training Log</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171a;
    --panel: #1b1f23;
    --panel-raised: #21262b;
    --border: #2a2f34;
    --text: #edeae3;
    --text-muted: #8b9198;
    --text-faint: #5a6067;
    --amber: #e8a33d;
    --padel: #e4572e;
    --resistance: #c9a66b;
    --cardio: #4fa8a0;
    --yoga: #9b8aa3;
    --weight: #7c93a8;
    --photo: #c97b84;
    --nutrition: #8fae5d;
    --day-good: #6fae5a;
    --day-neutral: #d9b23c;
    --day-bad: #8b9198;
    --danger: #d9534f;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-card: 0 1px 1px rgba(0,0,0,0.2), 0 10px 22px -14px rgba(0,0,0,0.65);
    --shadow-raised: 0 2px 3px rgba(0,0,0,0.25), 0 16px 32px -16px rgba(0,0,0,0.7);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  body {
    max-width: 560px;
    margin: 0 auto;
    padding-bottom: 88px;
    position: relative;
  }
  .display {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  header.top {
    padding: calc(20px + env(safe-area-inset-top)) 20px 18px;
    position: sticky;
    top: 0;
    background: linear-gradient(var(--bg) 78%, transparent);
    z-index: 5;
  }
  .top-date-label { font-size: 13px; color: var(--text-muted); margin: 0 0 2px; font-weight: 500; }
  .top-date { font-size: 40px; line-height: 1; margin: 0; }
  main { padding: 0 20px; }
  section.view { display: none; animation: fadein 0.18s ease; }
  section.view.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

  h2.section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin: 28px 0 12px;
  }
  h2.section-title:first-child { margin-top: 4px; }

  .quicklog-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .quicklog-card {
    border: none;
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: left;
    cursor: pointer;
    color: #14171a;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 26px;
    min-height: 100px;
    transition: transform 0.15s cubic-bezier(.2,.8,.3,1), box-shadow 0.15s ease;
    font-family: inherit;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
  }
  .quicklog-card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 45%);
    pointer-events: none;
  }
  .quicklog-card:active { transform: scale(0.96); box-shadow: var(--shadow-sm, 0 1px 1px rgba(0,0,0,0.2)); }
  .quicklog-card .ql-icon { width: 24px; height: 24px; position: relative; z-index: 1; }
  .quicklog-card .ql-icon svg { width: 100%; height: 100%; display: block; }
  .quicklog-card .ql-label { font-size: 15.5px; font-weight: 700; position: relative; z-index: 1; letter-spacing: -0.01em; }
  .quicklog-card.padel { background: var(--padel); color: #2b0e05; }
  .quicklog-card.resistance { background: var(--resistance); color: #2b2210; }
  .quicklog-card.cardio { background: var(--cardio); color: #08211e; }
  .quicklog-card.yoga { background: var(--yoga); color: #241f29; }
  .quicklog-card.weight { background: var(--weight); color: #0d1a24; }
  .quicklog-card.photo { background: var(--photo); color: #2a1013; }
  .quicklog-card.nutrition { background: var(--nutrition); color: #131f0a; }
  .quicklog-card.span-2 {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    min-height: auto;
    padding: 18px 16px;
  }
  .quicklog-card.span-2 .ql-label { font-size: 16px; }

  .custom-log-btn {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .custom-log-btn:active { background: var(--panel); }

  .session-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    background: var(--panel);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .session-item:active { transform: scale(0.985); background: var(--panel-raised); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.padel { background: var(--padel); }
  .dot.resistance { background: var(--resistance); }
  .dot.cardio { background: var(--cardio); }
  .dot.yoga { background: var(--yoga); }
  .dot.weight { background: var(--weight); }
  .dot.photo { background: var(--photo); }
  .dot.nutrition { background: var(--nutrition); }
  .session-item .si-main { flex: 1; min-width: 0; }
  .session-item .si-type { font-size: 13px; font-weight: 600; text-transform: capitalize; }
  .session-item .si-detail { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .si-time { font-size: 12px; color: var(--text-faint); flex-shrink: 0; }

  .empty-state {
    padding: 30px 16px;
    text-align: center;
    color: var(--text-faint);
    font-size: 13.5px;
    border: 1px dashed var(--border);
    border-radius: var(--radius-md);
  }

  /* Calendar */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
  }
  .cal-month-label { font-size: 17px; font-weight: 600; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-dow { text-align: center; font-size: 11px; color: var(--text-faint); padding-bottom: 6px; }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 13px;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid transparent;
    color: var(--text-muted);
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .cal-cell:active { transform: scale(0.92); }
  .cal-cell.empty { background: transparent; cursor: default; }
  .cal-cell.empty:active { transform: none; }
  .cal-cell.today { border-color: var(--amber); color: var(--amber); font-weight: 700; box-shadow: 0 0 0 1px var(--amber) inset; }
  .cal-cell.selected { background: var(--panel-raised); border-color: var(--text-faint); }
  .cal-cell .cal-dots { display: flex; gap: 2px; height: 6px; }
  .cal-cell .cal-dots .dot { width: 5px; height: 5px; }
  .cal-day-detail { margin-top: 20px; }

  /* Stats */
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-card);
  }
  .stat-card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .stat-card-head .dot { width: 10px; height: 10px; }
  .stat-card-head .name { font-size: 14px; font-weight: 600; text-transform: capitalize; }
  .stat-row { display: flex; gap: 18px; }
  .stat-num { flex: 1; }
  .stat-num .val { font-size: 30px; line-height: 1; }
  .stat-num .lbl { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

  .weekbar { margin-bottom: 22px; }
  .weekbar-bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; margin-top: 10px; }
  .weekbar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .weekbar-stack { width: 100%; max-width: 26px; display: flex; flex-direction: column-reverse; border-radius: 4px; overflow: hidden; }
  .weekbar-seg { width: 100%; height: 14px; }
  .weekbar-day { font-size: 10.5px; color: var(--text-faint); }

  /* Tab bar */
  nav.tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-width: 560px;
    margin: 0 auto;
    background: rgba(20, 23, 26, 0.86);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  nav.tabbar button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 0 4px;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  nav.tabbar button .tab-icon { width: 23px; height: 23px; transition: transform 0.15s cubic-bezier(.34,1.56,.64,1); }
  nav.tabbar button .tab-icon svg { width: 100%; height: 100%; display: block; }
  nav.tabbar button.active { color: var(--amber); }
  nav.tabbar button.active .tab-icon { transform: translateY(-1px) scale(1.04); }
  nav.tabbar button:active .tab-icon { transform: scale(0.9); }

  /* Sheet / modal */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 30;
    display: none;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    background: var(--panel);
    width: 100%;
    max-width: 560px;
    border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    box-shadow: var(--shadow-raised);
    animation: sheet-up 0.22s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes sheet-up {
    from { transform: translateY(24px); opacity: 0.4; }
    to { transform: translateY(0); opacity: 1; }
  }
  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sheet-title { font-size: 18px; font-weight: 700; text-transform: capitalize; }
  .sheet-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 11px 12px;
    font-family: inherit;
    font-size: 14.5px;
    transition: border-color 0.12s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--amber);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .seg-toggle { display: flex; gap: 8px; }
  .seg-toggle button {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--panel-raised);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .seg-toggle button.sel { border-color: var(--amber); color: var(--amber); background: rgba(232,163,61,0.1); }

  #dayRatingToggle button[data-v="good"].sel { border-color: var(--day-good); color: var(--day-good); background: rgba(111,174,90,0.14); }
  #dayRatingToggle button[data-v="neutral"].sel { border-color: var(--day-neutral); color: var(--day-neutral); background: rgba(217,178,60,0.14); }
  #dayRatingToggle button[data-v="off-track"].sel { border-color: var(--day-bad); color: var(--day-bad); background: rgba(139,145,152,0.14); }

  .exercise-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .exercise-row input { flex: 1; min-width: 0; }
  .exercise-row input.ex-name { flex-basis: 100%; }
  .exercise-row select.ex-unit { flex: 0 0 72px; font-size: 13px; padding: 10px 6px; }
  .exercise-row .ex-rm { background: none; border: none; color: var(--text-faint); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .add-exercise-btn {
    width: 100%; padding: 10px; border-radius: var(--radius-sm);
    border: 1px dashed var(--border); background: none; color: var(--text-muted);
    font-family: inherit; font-size: 13px; cursor: pointer; margin-bottom: 6px;
  }

  .si-thumb { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .photo-preview-wrap { margin-bottom: 14px; }
  .photo-preview-wrap img { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--radius-sm); display: block; }

  .sparkline { display: block; margin-top: 4px; }

  .checkbox-field { display: flex; align-items: center; justify-content: center; background: var(--panel-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
  .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); cursor: pointer; margin-bottom: 0 !important; }
  .checkbox-label input[type="checkbox"] { width: 19px; height: 19px; accent-color: var(--amber); flex-shrink: 0; }

  .save-btn {
    width: 100%;
    padding: 15px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--amber);
    color: #201404;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 8px 20px -8px rgba(232,163,61,0.5);
    transition: transform 0.1s ease;
  }
  .save-btn:active { transform: scale(0.98); opacity: 0.9; }
  .delete-btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--danger);
    background: none;
    color: var(--danger);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.1s ease;
  }
  .delete-btn:active { background: rgba(217,83,79,0.1); }

  .sync-note { font-size: 11px; color: var(--text-faint); text-align: center; margin: 18px 0 4px; }
</style>
</head>
<body>

<header class="top">
  <p class="top-date-label" id="topDateLabel">—</p>
  <h1 class="top-date display" id="topDate">—</h1>
</header>

<main>

  <section class="view active" id="view-log">
    <h2 class="section-title">Quick log</h2>
    <div class="quicklog-grid">
      <button class="quicklog-card nutrition span-2" data-type="nutrition">
        <span class="ql-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5v7a2.5 2.5 0 0 0 5 0v-7"/><line x1="8.5" y1="2.5" x2="8.5" y2="21.5"/><path d="M17 2.5c-1.5 1-2.3 3-2.3 5.3 0 2.6 1.3 4 2.3 4.7v9"/></svg></span>
        <span class="ql-label">Nutrition</span>
      </button>
      <button class="quicklog-card weight" data-type="weight">
        <span class="ql-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c0-2.5 1.5-4 3.5-4s3.5 1.5 3.5 4"/><line x1="12" y1="7" x2="12" y2="8.5"/></svg></span>
        <span class="ql-label">Weight</span>
      </button>
      <button class="quicklog-card photo" data-type="photo">
        <span class="ql-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.3"/></svg></span>
        <span class="ql-label">Daily photo</span>
      </button>
      <button class="quicklog-card padel" data-type="padel">
        <span class="ql-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="10" height="13" rx="5"/><line x1="10" y1="15.5" x2="10" y2="20"/><line x1="7" y1="21.5" x2="13" y2="21.5"/><circle cx="18.5" cy="18.5" r="2"/></svg></span>
        <span class="ql-label">Padel</span>
      </button>
      <button class="quicklog-card cardio" data-type="cardio">
        <span class="ql-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2.5-7 4 14 2.5-7H21"/></svg></span>
        <span class="ql-label">Cardio</span>
      </button>
      <button class="quicklog-card resistance" data-type="resistance">
        <span class="ql-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><line x1="5" y1="12" x2="19" y2="12"/><rect x="6.5" y="6.5" width="3" height="11" rx="1"/><rect x="14.5" y="6.5" width="3" height="11" rx="1"/></svg></span>
        <span class="ql-label">Resistance training</span>
      </button>
      <button class="quicklog-card yoga" data-type="yoga">
        <span class="ql-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.8" fill="currentColor" stroke="none"/><path d="M12 8v6"/><path d="M12 9c-2 2-3 3-6 3"/><path d="M12 9c2 2 3 3 6 3"/><path d="M12 14c-1.5 2-2 3-2 5.5"/><path d="M12 14c1.5 2 2 3 2 5.5"/></svg></span>
        <span class="ql-label">Mobility</span>
      </button>
    </div>

    <h2 class="section-title">Today</h2>
    <div id="todayList"></div>

    <h2 class="section-title">Recent</h2>
    <div id="recentList"></div>
    <p class="sync-note" id="syncNote"></p>
  </section>

  <section class="view" id="view-calendar">
    <div class="cal-nav">
      <button id="calPrev">‹</button>
      <span class="cal-month-label" id="calMonthLabel">—</span>
      <button id="calNext">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-day-detail" id="calDayDetail"></div>
  </section>

  <section class="view" id="view-stats">
    <h2 class="section-title">Last 7 days</h2>
    <div class="weekbar" id="weekBar"></div>

    <h2 class="section-title">By discipline</h2>
    <div id="statsCards"></div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab-btn active" data-view="log">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
    Log
  </button>
  <button class="tab-btn" data-view="calendar">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="6.5"/><line x1="16" y1="3" x2="16" y2="6.5"/></svg></span>
    Calendar
  </button>
  <button class="tab-btn" data-view="stats">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="13"/><line x1="12" y1="20" x2="12" y2="8"/><line x1="19" y1="20" x2="19" y2="15.5"/></svg></span>
    Stats
  </button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function(){

  // ---------- state ----------
  var sessions = [];   // {id, type, date, ...fields}
  var dbRef = null;
  var dbReady = false;
  var currentView = 'log';
  var calMonth = new Date(); calMonth.setDate(1);
  var selectedDay = null;
  var editingId = null;

  var TYPE_LABEL = { padel: 'Padel', resistance: 'Resistance training', cardio: 'Cardio', yoga: 'Mobility', weight: 'Weight', photo: 'Daily photo', nutrition: 'Nutrition' };
  var DAY_RATING_LABEL = { good: 'On-track', neutral: 'Neutral', 'off-track': 'Off-track' };
  var DEFAULT_CARDIO_TYPES = ['Running','Cycling','Swimming','Rowing','Walking'];
  var DEFAULT_EXERCISES = [
    {name:'Bench press', unit:'kg'}, {name:'Squat', unit:'kg'}, {name:'Deadlift', unit:'kg'},
    {name:'Overhead press', unit:'kg'}, {name:'Pull-up', unit:'reps'}, {name:'Plank', unit:'sec'}
  ];
  var presets = { cardioTypes: DEFAULT_CARDIO_TYPES.slice(), exercises: DEFAULT_EXERCISES.slice() };

  function normalizeSession(s){
    // legacy: sessions logged before the Cardio rename used type 'running'
    if (s.type === 'running'){
      s.type = 'cardio';
      if (!s.cardioType) s.cardioType = 'Running';
    }
    // legacy: sessions logged before the Resistance training rename used type 'gym'
    if (s.type === 'gym'){
      s.type = 'resistance';
    }
    return s;
  }

  function todayStr(){ return fmtDate(new Date()); }
  function fmtDate(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+da;
  }
  function niceDate(d){
    return d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
  }
  function niceTime(iso){
    try { return new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); } catch(e){ return ''; }
  }
  function uid(){ return 'l' + Math.random().toString(36).slice(2,10); }

  // ---------- persistence (Firebase Firestore) ----------
  // Fill in your project's config here — Firebase console → Project settings →
  // "Your apps" → the </> web icon → copy the firebaseConfig object.
  var firebaseConfig = {
    apiKey: "AIzaSyA1W9UcEkQ67cy1oY6PfPqaylDXhUxGqb8",
    authDomain: "ledger-6aec3.firebaseapp.com",
    projectId: "ledger-6aec3",
    storageBucket: "ledger-6aec3.firebasestorage.app",
    messagingSenderId: "607695857530",
    appId: "1:607695857530:web:5cd564760be8a755de58c3"
  };

  function localSave(){
    try { localStorage.setItem('ledger_sessions_fallback', JSON.stringify(sessions)); } catch(e){}
  }
  function localLoad(){
    try {
      var raw = localStorage.getItem('ledger_sessions_fallback');
      if (raw) sessions = JSON.parse(raw).map(normalizeSession);
    } catch(e){}
  }
  function localSavePresets(){
    try { localStorage.setItem('ledger_presets_fallback', JSON.stringify(presets)); } catch(e){}
  }
  function localLoadPresets(){
    try {
      var raw = localStorage.getItem('ledger_presets_fallback');
      if (raw) presets = JSON.parse(raw);
    } catch(e){}
  }

  async function initDb(){
    try {
      if (firebaseConfig.apiKey === "YOUR_API_KEY") { fallbackMode(); return; }
      firebase.initializeApp(firebaseConfig);
      dbRef = firebase.firestore();
      dbReady = true;
      document.getElementById('syncNote').textContent = '';
      dbRef.collection('ledger_sessions').orderBy('date','desc')
        .onSnapshot(function(snap){
          sessions = snap.docs.map(function(d){ var data = d.data() || {}; data.id = d.id; return normalizeSession(data); });
          renderAll();
        }, function(err){
          console.error('firestore snapshot error', err);
          fallbackMode();
        });
      dbRef.collection('ledger_meta').doc('presets').onSnapshot(function(doc){
        if (doc.exists){
          var data = doc.data();
          presets.cardioTypes = data.cardioTypes || DEFAULT_CARDIO_TYPES.slice();
          presets.exercises = data.exercises || DEFAULT_EXERCISES.slice();
        } else {
          dbRef.collection('ledger_meta').doc('presets').set(presets).catch(function(){});
        }
      }, function(err){ console.error('presets snapshot error', err); });
    } catch(e){
      console.error(e);
      fallbackMode();
    }
  }

  function fallbackMode(){
    dbReady = false;
    localLoad();
    localLoadPresets();
    document.getElementById('syncNote').textContent = 'Saving on this device only — add your Firebase config to sync';
    renderAll();
  }

  async function savePresets(){
    if (dbReady && dbRef){
      try { await dbRef.collection('ledger_meta').doc('presets').set(presets); return; }
      catch(e){ console.error('presets save failed', e); }
    }
    localSavePresets();
  }

  async function saveSession(data){
    if (dbReady && dbRef){
      try {
        if (data.id){
          var id = data.id; var copy = Object.assign({}, data); delete copy.id;
          await dbRef.collection('ledger_sessions').doc(id).set(copy);
        } else {
          await dbRef.collection('ledger_sessions').add(data);
        }
        return;
      } catch(e){ console.error('save failed, falling back', e); }
    }
    // local fallback
    if (data.id){
      var idx = sessions.findIndex(function(s){ return s.id === data.id; });
      if (idx > -1) sessions[idx] = data;
    } else {
      data.id = uid();
      sessions.unshift(data);
    }
    localSave();
    renderAll();
  }

  async function deleteSession(id){
    if (dbReady && dbRef){
      try { await dbRef.collection('ledger_sessions').doc(id).delete(); return; }
      catch(e){ console.error(e); }
    }
    sessions = sessions.filter(function(s){ return s.id !== id; });
    localSave();
    renderAll();
  }

  // ---------- tab switching ----------
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentView = btn.dataset.view;
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      document.getElementById('view-' + currentView).classList.add('active');
      if (currentView === 'calendar') renderCalendar();
      if (currentView === 'stats') renderStats();
    });
  });

  // ---------- header ----------
  function renderHeader(){
    var now = new Date();
    document.getElementById('topDateLabel').textContent = now.toLocaleDateString(undefined,{ weekday:'long' });
    document.getElementById('topDate').textContent = now.toLocaleDateString(undefined,{ day:'numeric', month:'long' });
  }

  // ---------- log view ----------
  function sessionDetailText(s){
    if (s.type === 'padel'){
      var parts = [];
      if (s.result) parts.push(s.result === 'win' ? 'Won' : s.result === 'loss' ? 'Lost' : 'Played');
      if (s.gamesWon != null && s.gamesLost != null) parts.push(s.gamesWon + '–' + s.gamesLost);
      if (s.opponent) parts.push('vs ' + s.opponent);
      return parts.join(' · ') || 'Match logged';
    }
    if (s.type === 'resistance'){
      var n = (s.exercises||[]).length;
      return n ? n + ' exercise' + (n===1?'':'s') + (s.bodyweight ? ' · ' + s.bodyweight + 'kg' : '') : 'Session logged';
    }
    if (s.type === 'cardio'){
      var bits = [];
      if (s.cardioType) bits.push(s.cardioType);
      if (s.distance) bits.push(s.distance + ' ' + (s.distanceUnit || 'km'));
      if (s.durationMin) bits.push(s.durationMin + ' min');
      return bits.join(' · ') || 'Session logged';
    }
    if (s.type === 'yoga'){
      var b2 = [];
      if (s.focus) b2.push(s.focus);
      if (s.durationMin) b2.push(s.durationMin + ' min');
      return b2.join(' · ') || 'Session logged';
    }
    if (s.type === 'weight'){
      return s.weightKg ? s.weightKg + ' kg' : 'Weight logged';
    }
    if (s.type === 'photo'){
      return s.notes || 'Photo added';
    }
    if (s.type === 'nutrition'){
      var nb = [];
      if (s.dayRating) nb.push(DAY_RATING_LABEL[s.dayRating] + ' day');
      if (s.calories) nb.push(s.calories + ' kcal');
      if (s.glutenFree) nb.push('GF');
      if (s.minimalProcessed) nb.push('Minimal processed');
      if (s.sufficientWater) nb.push('Hydrated');
      return nb.join(' · ') || 'Day logged';
    }
    return s.notes || '';
  }

  function renderSessionItem(s){
    var div = document.createElement('div');
    div.className = 'session-item';
    var leadHtml = (s.type === 'photo' && s.photoDataUrl)
      ? '<img class="si-thumb" src="' + s.photoDataUrl + '">'
      : '<span class="dot ' + s.type + '"></span>';
    div.innerHTML =
      leadHtml +
      '<div class="si-main">' +
        '<div class="si-type">' + TYPE_LABEL[s.type] + '</div>' +
        '<div class="si-detail">' + sessionDetailText(s) + '</div>' +
      '</div>' +
      '<div class="si-time">' + (s.createdAt ? niceTime(s.createdAt) : '') + '</div>';
    div.addEventListener('click', function(){ openSheet(s.type, s); });
    return div;
  }

  function renderLogView(){
    var today = todayStr();
    var todayList = document.getElementById('todayList');
    var recentList = document.getElementById('recentList');
    todayList.innerHTML = '';
    recentList.innerHTML = '';

    var todaysSessions = sessions.filter(function(s){ return s.date === today; });
    if (!todaysSessions.length){
      var e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = 'Nothing logged yet today — tap a card above to start';
      todayList.appendChild(e);
    } else {
      todaysSessions.forEach(function(s){ todayList.appendChild(renderSessionItem(s)); });
    }

    var recent = sessions.filter(function(s){ return s.date !== today; }).slice(0, 8);
    if (!recent.length){
      var e2 = document.createElement('div');
      e2.className = 'empty-state';
      e2.textContent = 'Your recent sessions will show up here';
      recentList.appendChild(e2);
    } else {
      recent.forEach(function(s){ recentList.appendChild(renderSessionItem(s)); });
    }
  }

  document.querySelectorAll('.quicklog-card').forEach(function(card){
    card.addEventListener('click', function(){ openSheet(card.dataset.type, null); });
  });

  // ---------- calendar view ----------
  function renderCalendar(){
    var label = calMonth.toLocaleDateString(undefined, { month:'long', year:'numeric' });
    document.getElementById('calMonthLabel').textContent = label;
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['S','M','T','W','T','F','S'].forEach(function(d){
      var el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    var year = calMonth.getFullYear(), month = calMonth.getMonth();
    var firstDow = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var today = todayStr();

    for (var i=0; i<firstDow; i++){
      var pad = document.createElement('div');
      pad.className = 'cal-cell empty';
      grid.appendChild(pad);
    }
    for (var day=1; day<=daysInMonth; day++){
      var dateObj = new Date(year, month, day);
      var dateStr = fmtDate(dateObj);
      var cell = document.createElement('div');
      cell.className = 'cal-cell';
      if (dateStr === today) cell.classList.add('today');
      if (dateStr === selectedDay) cell.classList.add('selected');

      var daySessions = sessions.filter(function(s){ return s.date === dateStr; });
      var typesPresent = [];
      daySessions.forEach(function(s){ if (typesPresent.indexOf(s.type) === -1) typesPresent.push(s.type); });

      var dotsHtml = typesPresent.slice(0,4).map(function(t){ return '<span class="dot ' + t + '"></span>'; }).join('');
      cell.innerHTML = '<span>' + day + '</span>' + (dotsHtml ? '<span class="cal-dots">' + dotsHtml + '</span>' : '');
      cell.addEventListener('click', function(ds){
        return function(){ selectedDay = ds; renderCalendar(); };
      }(dateStr));
      grid.appendChild(cell);
    }

    renderDayDetail();
  }

  function renderDayDetail(){
    var wrap = document.getElementById('calDayDetail');
    wrap.innerHTML = '';
    if (!selectedDay) return;
    var d = new Date(selectedDay + 'T00:00:00');
    var head = document.createElement('h2');
    head.className = 'section-title';
    head.style.marginTop = '0';
    head.textContent = niceDate(d);
    wrap.appendChild(head);

    var daySessions = sessions.filter(function(s){ return s.date === selectedDay; });
    if (!daySessions.length){
      var e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = 'No sessions logged this day';
      wrap.appendChild(e);
    } else {
      daySessions.forEach(function(s){ wrap.appendChild(renderSessionItem(s)); });
    }

    var addBtn = document.createElement('button');
    addBtn.className = 'custom-log-btn';
    addBtn.textContent = 'Log a session for this day';
    addBtn.addEventListener('click', function(){ openSheet('padel', null, selectedDay); });
    wrap.appendChild(addBtn);
  }

  document.getElementById('calPrev').addEventListener('click', function(){
    calMonth.setMonth(calMonth.getMonth()-1); renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', function(){
    calMonth.setMonth(calMonth.getMonth()+1); renderCalendar();
  });

  // ---------- stats view ----------
  function withinDays(s, n){
    var d = new Date(s.date + 'T00:00:00');
    var cutoff = new Date(); cutoff.setDate(cutoff.getDate() - n); cutoff.setHours(0,0,0,0);
    return d >= cutoff;
  }
  function withinThisMonth(s){
    var d = new Date(s.date + 'T00:00:00');
    var now = new Date();
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }

  function renderStats(){
    renderWeekBar();
    var container = document.getElementById('statsCards');
    container.innerHTML = '';

    // Padel
    var padel = sessions.filter(function(s){ return s.type==='padel'; });
    var padelMonth = padel.filter(withinThisMonth);
    var wins = padelMonth.filter(function(s){ return s.result==='win'; }).length;
    var winRate = padelMonth.length ? Math.round(100*wins/padelMonth.length) : 0;
    container.appendChild(statCard('padel', [
      { val: padelMonth.length, lbl: 'Matches this month' },
      { val: padelMonth.length ? winRate + '%' : '—', lbl: 'Win rate' }
    ]));

    // Gym
    var gym = sessions.filter(function(s){ return s.type==='resistance'; });
    var gymWeek = gym.filter(function(s){ return withinDays(s,7); });
    var lastBw = gym.find(function(s){ return s.bodyweight; });
    container.appendChild(statCard('resistance', [
      { val: gymWeek.length, lbl: 'Sessions this week' },
      { val: lastBw && lastBw.bodyweight ? lastBw.bodyweight + 'kg' : '—', lbl: 'Last logged bodyweight' }
    ]));

    // Cardio
    var cardio = sessions.filter(function(s){ return s.type==='cardio'; });
    var cardioMonth = cardio.filter(withinThisMonth);
    var totalCardioMin = cardioMonth.reduce(function(a,s){ return a + (s.durationMin||0); }, 0);
    container.appendChild(statCard('cardio', [
      { val: cardioMonth.length, lbl: 'Sessions this month' },
      { val: totalCardioMin || 0, lbl: 'Minutes this month' }
    ]));

    // Yoga
    var yoga = sessions.filter(function(s){ return s.type==='yoga'; });
    var yogaWeek = yoga.filter(function(s){ return withinDays(s,7); });
    container.appendChild(statCard('yoga', [
      { val: yogaWeek.length, lbl: 'Sessions this week' },
      { val: yoga.length, lbl: 'All-time sessions' }
    ]));

    // Weight (merges dedicated weight logs + bodyweight noted in gym sessions)
    var weightEntries = sessions
      .filter(function(s){ return (s.type==='weight' && s.weightKg) || (s.type==='resistance' && s.bodyweight); })
      .map(function(s){ return { date: s.date, val: s.type==='weight' ? s.weightKg : s.bodyweight }; })
      .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var latestWeight = weightEntries.length ? weightEntries[weightEntries.length-1].val : null;
    var weightCard = statCard('weight', [
      { val: latestWeight != null ? latestWeight + 'kg' : '—', lbl: 'Latest weight' },
      { val: weightEntries.length, lbl: 'Entries logged' }
    ]);
    if (weightEntries.length > 1){
      var sparkWrap = document.createElement('div');
      sparkWrap.innerHTML = sparklineSvg(weightEntries.slice(-14).map(function(e){ return e.val; }), getComputedStyle(document.documentElement).getPropertyValue('--weight').trim());
      weightCard.appendChild(sparkWrap.firstChild);
    }
    container.appendChild(weightCard);

    // Photos
    var photos = sessions.filter(function(s){ return s.type==='photo'; });
    var photosMonth = photos.filter(withinThisMonth);
    container.appendChild(statCard('photo', [
      { val: photosMonth.length, lbl: 'Photos this month' },
      { val: photos.length, lbl: 'All-time photos' }
    ]));

    // Nutrition
    var nutrition = sessions.filter(function(s){ return s.type==='nutrition'; });
    var nutritionMonth = nutrition.filter(withinThisMonth);
    var goodDays = nutritionMonth.filter(function(s){ return s.dayRating==='good'; }).length;
    var gfDays = nutritionMonth.filter(function(s){ return s.glutenFree; }).length;
    var hydratedDays = nutritionMonth.filter(function(s){ return s.sufficientWater; }).length;
    container.appendChild(statCard('nutrition', [
      { val: goodDays, lbl: 'On-track days this month' },
      { val: gfDays, lbl: 'Gluten-free days' },
      { val: hydratedDays, lbl: 'Hydrated days' }
    ]));
  }

  function sparklineSvg(values, color){
    if (!values.length) return '';
    var w = 200, h = 36, pad = 3;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var range = (max - min) || 1;
    var step = values.length > 1 ? (w - pad*2) / (values.length - 1) : 0;
    var points = values.map(function(v, i){
      var x = pad + i*step;
      var y = h - pad - ((v - min) / range) * (h - pad*2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg class="sparkline" viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="36" preserveAspectRatio="none">' +
      '<polyline points="' + points + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }

  function statCard(type, nums){
    var card = document.createElement('div');
    card.className = 'stat-card';
    var head = document.createElement('div');
    head.className = 'stat-card-head';
    head.innerHTML = '<span class="dot ' + type + '"></span><span class="name">' + TYPE_LABEL[type] + '</span>';
    card.appendChild(head);
    var row = document.createElement('div');
    row.className = 'stat-row';
    nums.forEach(function(n){
      var col = document.createElement('div');
      col.className = 'stat-num';
      col.innerHTML = '<div class="val display">' + n.val + '</div><div class="lbl">' + n.lbl + '</div>';
      row.appendChild(col);
    });
    card.appendChild(row);
    return card;
  }

  function renderWeekBar(){
    var wrap = document.getElementById('weekBar');
    wrap.innerHTML = '';
    var bars = document.createElement('div');
    bars.className = 'weekbar-bars';
    var days = [];
    for (var i=6; i>=0; i--){
      var d = new Date(); d.setDate(d.getDate()-i);
      days.push(d);
    }
    var maxCount = 1;
    var counts = days.map(function(d){
      var ds = fmtDate(d);
      var daySessions = sessions.filter(function(s){ return s.date === ds; });
      if (daySessions.length > maxCount) maxCount = daySessions.length;
      return daySessions;
    });

    days.forEach(function(d, i){
      var col = document.createElement('div');
      col.className = 'weekbar-col';
      var stack = document.createElement('div');
      stack.className = 'weekbar-stack';
      var h = (counts[i].length / maxCount) * 74;
      stack.style.height = Math.max(h, counts[i].length ? 10 : 0) + 'px';
      counts[i].forEach(function(s){
        var seg = document.createElement('div');
        seg.className = 'weekbar-seg ' + s.type;
        seg.style.background = 'var(--' + s.type + ')';
        stack.appendChild(seg);
      });
      col.appendChild(stack);
      var lbl = document.createElement('div');
      lbl.className = 'weekbar-day';
      lbl.textContent = d.toLocaleDateString(undefined,{weekday:'narrow'});
      col.appendChild(lbl);
      bars.appendChild(col);
    });
    wrap.appendChild(bars);
  }

  // ---------- sheet (log form) ----------
  var backdrop = document.getElementById('sheetBackdrop');
  var sheetEl = document.getElementById('sheet');

  function closeSheet(){
    backdrop.classList.remove('open');
    editingId = null;
  }
  backdrop.addEventListener('click', function(e){ if (e.target === backdrop) closeSheet(); });

  function openSheet(type, existing, forcedDate){
    editingId = existing ? existing.id : null;
    var data = existing || { type: type, date: forcedDate || todayStr() };
    sheetEl.innerHTML = buildFormHtml(type, data);
    backdrop.classList.add('open');
    wireForm(type, data);
  }

  function fieldNum(id, label, value, placeholder, step){
    return '<div class="field"><label>'+label+'</label><input type="number" id="'+id+'" value="'+(value!=null?value:'')+'" placeholder="'+(placeholder||'')+'" step="'+(step||'any')+'"></div>';
  }
  function fieldText(id, label, value, placeholder){
    return '<div class="field"><label>'+label+'</label><input type="text" id="'+id+'" value="'+(value!=null?value.replace(/"/g,'&quot;'):'')+'" placeholder="'+(placeholder||'')+'"></div>';
  }
  function fieldDate(id, label, value){
    return '<div class="field"><label>'+label+'</label><input type="date" id="'+id+'" value="'+value+'"></div>';
  }
  function fieldSelect(id, label, options, value){
    var opts = options.map(function(o){
      var v = typeof o === 'object' ? o.value : o;
      var l = typeof o === 'object' ? o.label : o;
      return '<option value="'+v+'"' + (v===value?' selected':'') + '>'+l+'</option>';
    }).join('');
    return '<div class="field"><label>'+label+'</label><select id="'+id+'">'+opts+'</select></div>';
  }
  function fieldNotes(value){
    return '<div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Anything worth remembering">'+(value||'')+'</textarea></div>';
  }
  function fieldCheckbox(id, label, checked){
    return '<div class="field checkbox-field"><label class="checkbox-label"><input type="checkbox" id="'+id+'"'+(checked?' checked':'')+'> '+label+'</label></div>';
  }

  var UNIT_OPTIONS = ['kg','lb','reps','sec','m'];

  function buildFormHtml(type, d){
    var html = '<div class="sheet-handle"></div>';
    html += '<div class="sheet-head"><div class="sheet-title">' + TYPE_LABEL[type] + '</div><button class="sheet-close" id="sheetCloseBtn">✕</button></div>';
    html += fieldDate('f_date', 'Date', d.date || todayStr());

    if (type === 'padel'){
      html += '<div class="field"><label>Result</label><div class="seg-toggle" id="resultToggle">' +
        '<button data-v="win" class="'+(d.result==='win'?'sel':'')+'">Win</button>' +
        '<button data-v="loss" class="'+(d.result==='loss'?'sel':'')+'">Loss</button>' +
        '</div></div>';
      html += '<div class="field-row">' +
        fieldNum('f_gamesWon','Games won', d.gamesWon, '6') +
        fieldNum('f_gamesLost','Games lost', d.gamesLost, '3') +
      '</div>';
      html += fieldText('f_opponent', 'Group / opponent', d.opponent, 'e.g. Thursday group');
      html += fieldNum('f_durationMin', 'Duration (min)', d.durationMin, '90');
    }

    if (type === 'resistance'){
      html += '<div class="field"><label>Exercises</label><div id="exerciseRows"></div>' +
        '<button type="button" class="add-exercise-btn" id="addExerciseBtn">+ Add exercise</button></div>';
      html += fieldNum('f_bodyweight', 'Bodyweight (kg, optional)', d.bodyweight, '104');
      html += fieldNum('f_durationMin', 'Duration (min)', d.durationMin, '60');
    }

    if (type === 'cardio'){
      var cardioTypeOpts = presets.cardioTypes.map(function(t){ return {value:t, label:t}; });
      cardioTypeOpts.push({value:'__new__', label:'+ New type…'});
      html += fieldSelect('f_cardioType', 'Type', cardioTypeOpts, d.cardioType || presets.cardioTypes[0]);
      html += '<div class="field" id="cardioNewTypeField" style="display:none">' +
        '<label>New type name</label><input type="text" id="f_cardioTypeNew" placeholder="e.g. Rowing machine"></div>';
      html += '<div class="field-row">' +
        fieldNum('f_distance','Distance', d.distance, '5') +
        fieldSelect('f_distanceUnit', 'Unit', ['km','mi','m'], d.distanceUnit || 'km') +
      '</div>';
      html += fieldNum('f_durationMin','Duration (min)', d.durationMin, '28');
    }

    if (type === 'yoga'){
      html += fieldText('f_focus', 'Focus', d.focus, 'e.g. hip mobility, full flow');
      html += fieldNum('f_durationMin', 'Duration (min)', d.durationMin, '30');
    }

    if (type === 'weight'){
      html += fieldNum('f_weightKg', 'Weight (kg)', d.weightKg, '104.0', '0.1');
    }

    if (type === 'photo'){
      html += '<div class="photo-preview-wrap" id="photoPreviewWrap" style="' + (d.photoDataUrl ? '' : 'display:none') + '">' +
        '<img id="photoPreviewImg" src="' + (d.photoDataUrl || '') + '"></div>';
      html += '<div class="field"><label>' + (d.photoDataUrl ? 'Replace photo' : 'Photo') + '</label>' +
        '<input type="file" id="f_photo" accept="image/*" capture="environment"></div>';
    }

    if (type === 'nutrition'){
      html += '<div class="field"><label>How was the day?</label><div class="seg-toggle" id="dayRatingToggle">' +
        '<button data-v="good" class="'+(d.dayRating==='good'?'sel':'')+'">On-track</button>' +
        '<button data-v="neutral" class="'+(d.dayRating==='neutral'?'sel':'')+'">Neutral</button>' +
        '<button data-v="off-track" class="'+(d.dayRating==='off-track'?'sel':'')+'">Off-track</button>' +
        '</div></div>';
      html += fieldCheckbox('f_glutenFree', 'Gluten-free', d.glutenFree);
      html += fieldCheckbox('f_minimalProcessed', 'Minimal processed foods', d.minimalProcessed);
      html += fieldCheckbox('f_sufficientWater', 'Sufficient water intake', d.sufficientWater);
      html += '<div class="field"><label>Food diary (optional)</label><textarea id="f_foodDiary" placeholder="What did you eat today">'+(d.foodDiary||'')+'</textarea></div>';
      html += fieldNum('f_calories', 'Calories (optional)', d.calories, '2200');
    }

    if (type !== 'nutrition') html += fieldNotes(d.notes);
    html += '<button class="save-btn" id="saveBtn">Save</button>';
    if (editingId) html += '<button class="delete-btn" id="deleteBtn">Delete</button>';
    return html;
  }

  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if (h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function wireForm(type, d){
    document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);

    var exerciseState = (d.exercises && d.exercises.length) ? d.exercises.slice() : (type==='resistance' ? [{name:'',sets:'',reps:'',value:'',unit:'kg'}] : []);
    var pendingPhotoDataUrl = d.photoDataUrl || null;

    if (type === 'padel'){
      var resultVal = d.result || null;
      document.querySelectorAll('#resultToggle button').forEach(function(b){
        b.addEventListener('click', function(){
          resultVal = (resultVal === b.dataset.v) ? null : b.dataset.v;
          document.querySelectorAll('#resultToggle button').forEach(function(x){ x.classList.remove('sel'); });
          if (resultVal) b.classList.add('sel');
        });
      });
    }

    if (type === 'nutrition'){
      var dayRatingVal = d.dayRating || null;
      document.querySelectorAll('#dayRatingToggle button').forEach(function(b){
        b.addEventListener('click', function(){
          dayRatingVal = (dayRatingVal === b.dataset.v) ? null : b.dataset.v;
          document.querySelectorAll('#dayRatingToggle button').forEach(function(x){ x.classList.remove('sel'); });
          if (dayRatingVal) b.classList.add('sel');
        });
      });
    }

    if (type === 'cardio'){
      var typeSelect = document.getElementById('f_cardioType');
      var newTypeField = document.getElementById('cardioNewTypeField');
      function syncNewTypeVisibility(){
        newTypeField.style.display = (typeSelect.value === '__new__') ? '' : 'none';
      }
      typeSelect.addEventListener('change', syncNewTypeVisibility);
      syncNewTypeVisibility();
    }

    if (type === 'resistance'){
      var rowsWrap = document.getElementById('exerciseRows');
      var dlId = 'exerciseSuggestions';
      if (!document.getElementById(dlId)){
        var dl = document.createElement('datalist');
        dl.id = dlId;
        document.body.appendChild(dl);
      }
      var dlEl = document.getElementById(dlId);
      dlEl.innerHTML = presets.exercises.map(function(e){ return '<option value="'+e.name.replace(/"/g,'&quot;')+'">'; }).join('');

      function renderRows(){
        rowsWrap.innerHTML = '';
        exerciseState.forEach(function(ex, i){
          var row = document.createElement('div');
          row.className = 'exercise-row';
          var unitOptsHtml = UNIT_OPTIONS.map(function(u){ return '<option value="'+u+'"'+(ex.unit===u?' selected':'')+'>'+u+'</option>'; }).join('');
          row.innerHTML =
            '<input class="ex-name" list="'+dlId+'" placeholder="Exercise name" value="'+(ex.name||'').replace(/"/g,'&quot;')+'">' +
            '<input placeholder="Sets" type="number" value="'+(ex.sets||'')+'" style="max-width:56px">' +
            '<input placeholder="Reps" type="number" value="'+(ex.reps||'')+'" style="max-width:56px">' +
            '<input placeholder="Value" type="number" value="'+(ex.value||'')+'" style="max-width:64px">' +
            '<select class="ex-unit">'+unitOptsHtml+'</select>' +
            '<button type="button" class="ex-rm">✕</button>';
          var inputs = row.querySelectorAll('input');
          inputs[0].addEventListener('input', function(){ exerciseState[i].name = inputs[0].value; });
          inputs[1].addEventListener('input', function(){ exerciseState[i].sets = inputs[1].value; });
          inputs[2].addEventListener('input', function(){ exerciseState[i].reps = inputs[2].value; });
          inputs[3].addEventListener('input', function(){ exerciseState[i].value = inputs[3].value; });
          row.querySelector('.ex-unit').addEventListener('change', function(e){ exerciseState[i].unit = e.target.value; });
          row.querySelector('.ex-rm').addEventListener('click', function(){
            exerciseState.splice(i,1); renderRows();
          });
          rowsWrap.appendChild(row);
        });
      }
      renderRows();
      document.getElementById('addExerciseBtn').addEventListener('click', function(){
        exerciseState.push({name:'',sets:'',reps:'',value:'',unit:'kg'});
        renderRows();
      });
    }

    if (type === 'photo'){
      document.getElementById('f_photo').addEventListener('change', function(e){
        var file = e.target.files[0];
        if (!file) return;
        compressImage(file, 900, 0.65).then(function(dataUrl){
          pendingPhotoDataUrl = dataUrl;
          var wrap = document.getElementById('photoPreviewWrap');
          document.getElementById('photoPreviewImg').src = dataUrl;
          wrap.style.display = '';
        }).catch(function(err){ console.error('photo compress failed', err); });
      });
    }

    document.getElementById('saveBtn').addEventListener('click', function(){
      var out = { type: type, date: document.getElementById('f_date').value || todayStr() };
      if (editingId) out.id = editingId;
      out.createdAt = (d.createdAt) || new Date().toISOString();
      var notesEl = document.getElementById('f_notes');
      out.notes = notesEl ? notesEl.value : '';

      if (type === 'padel'){
        out.result = typeof resultVal !== 'undefined' ? resultVal : (d.result || null);
        out.gamesWon = numOrNull('f_gamesWon');
        out.gamesLost = numOrNull('f_gamesLost');
        out.opponent = document.getElementById('f_opponent').value;
        out.durationMin = numOrNull('f_durationMin');
      }
      if (type === 'resistance'){
        var finalExercises = exerciseState.filter(function(e){ return e.name; }).map(function(e){
          return { name: e.name, sets: e.sets ? Number(e.sets) : null, reps: e.reps ? Number(e.reps) : null,
                   value: e.value ? Number(e.value) : null, unit: e.unit || 'kg' };
        });
        out.exercises = finalExercises;
        out.bodyweight = numOrNull('f_bodyweight');
        out.durationMin = numOrNull('f_durationMin');

        // Offer to save any new exercise names as presets
        var knownNames = presets.exercises.map(function(e){ return e.name.toLowerCase(); });
        var newOnes = finalExercises.filter(function(e){ return knownNames.indexOf(e.name.toLowerCase()) === -1; });
        newOnes.forEach(function(e){
          if (confirm('Save "' + e.name + '" (' + e.unit + ') as a new exercise for quick access next time?')){
            presets.exercises.push({ name: e.name, unit: e.unit });
            knownNames.push(e.name.toLowerCase());
          }
        });
        if (newOnes.length) savePresets();
      }
      if (type === 'cardio'){
        var typeSelectEl = document.getElementById('f_cardioType');
        var chosenType = typeSelectEl.value;
        if (chosenType === '__new__'){
          var newName = document.getElementById('f_cardioTypeNew').value.trim();
          if (newName){
            chosenType = newName;
            if (presets.cardioTypes.indexOf(newName) === -1 &&
                confirm('Save "' + newName + '" as a new cardio type for quick access?')){
              presets.cardioTypes.push(newName);
              savePresets();
            }
          } else {
            chosenType = presets.cardioTypes[0];
          }
        }
        out.cardioType = chosenType;
        out.distance = numOrNull('f_distance');
        out.distanceUnit = document.getElementById('f_distanceUnit').value;
        out.durationMin = numOrNull('f_durationMin');
      }
      if (type === 'yoga'){
        out.focus = document.getElementById('f_focus').value;
        out.durationMin = numOrNull('f_durationMin');
      }
      if (type === 'weight'){
        out.weightKg = numOrNull('f_weightKg');
      }
      if (type === 'photo'){
        out.photoDataUrl = pendingPhotoDataUrl || d.photoDataUrl || null;
      }
      if (type === 'nutrition'){
        out.dayRating = typeof dayRatingVal !== 'undefined' ? dayRatingVal : (d.dayRating || null);
        out.glutenFree = document.getElementById('f_glutenFree').checked;
        out.minimalProcessed = document.getElementById('f_minimalProcessed').checked;
        out.sufficientWater = document.getElementById('f_sufficientWater').checked;
        out.foodDiary = document.getElementById('f_foodDiary').value;
        out.calories = numOrNull('f_calories');
      }

      saveSession(out);
      closeSheet();
    });

    if (editingId){
      document.getElementById('deleteBtn').addEventListener('click', function(){
        deleteSession(editingId);
        closeSheet();
      });
    }
  }

  function numOrNull(id){
    var el = document.getElementById(id);
    if (!el || el.value === '') return null;
    return Number(el.value);
  }

  // ---------- render orchestration ----------
  function renderAll(){
    renderHeader();
    renderLogView();
    if (currentView === 'calendar') renderCalendar();
    if (currentView === 'stats') renderStats();
  }

  renderHeader();
  renderAll();
  initDb();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW registration failed', e); });
    });
  }

})();
</script>
