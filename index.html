<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#15130f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ledger</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ---- surfaces: warm near-black → charcoal → graphite, tonal steps instead of shadow ---- */
    --bg: #15130f;
    --panel: #1d1a15;
    --panel-raised: #26221b;
    --panel-inset: #110f0c;
    --border: #37312a;
    --border-soft: #2a2620;

    /* ---- text: warm ivory, never pure white ---- */
    --text: #efe7da;
    --text-muted: #a89b8a;
    --text-faint: #6c6255;

    /* ---- accent: champagne gold, used sparingly ---- */
    --gold: #c6a15c;
    --gold-rgb: 198,161,92;
    --gold-soft: #ddc08a;
    --amber: var(--gold); /* legacy alias, referenced throughout */
    --ink: #221a11; /* dark text set on gold / bright surfaces */

    /* ---- category accents: muted, for dots/icons/edges — not large fills ---- */
    --padel: #bd6640;
    --padel-soft: rgba(189,102,64,0.16);
    --resistance: #b99669;
    --resistance-soft: rgba(185,150,105,0.16);
    --cardio: #4c8c86;
    --cardio-soft: rgba(76,140,134,0.16);
    --yoga: #8b7a8f;
    --yoga-soft: rgba(139,122,143,0.16);
    --weight: #71889d;
    --weight-soft: rgba(113,136,157,0.16);
    --photo: #b4707a;
    --photo-soft: rgba(180,112,122,0.16);
    --nutrition: #839c5e;
    --nutrition-soft: rgba(131,156,94,0.16);
    --gluten: #a24f3e;
    --gluten-soft: rgba(162,79,62,0.16);

    /* ---- outcome / status ---- */
    --day-good: #6e9958;
    --day-good-rgb: 110,153,88;
    --day-neutral: #b99a49;
    --day-neutral-rgb: 185,154,73;
    --day-bad: #8c8171;
    --day-bad-rgb: 140,129,113;
    --danger: #be5b4c;
    --danger-rgb: 190,91,76;

    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;

    /* subtle depth only — no heavy/glowing shadows */
    --shadow-card: 0 1px 2px rgba(0,0,0,0.22);
    --shadow-raised: 0 10px 30px -16px rgba(0,0,0,0.6);

    /* spacing scale */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  html, body { height: 100%; }
  body {
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .display {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    letter-spacing: 0;
  }
  .display.light { font-weight: 480; }
  header.top {
    padding: calc(14px + env(safe-area-inset-top)) 20px 12px;
    position: sticky;
    top: 0;
    background: linear-gradient(var(--bg) 82%, transparent);
    z-index: 5;
  }
  .day-nav { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .day-nav-arrow {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border-soft);
    background: none;
    color: var(--text-muted);
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.12s ease, opacity 0.12s ease, color 0.12s ease;
  }
  .day-nav-arrow:active { background: var(--panel); color: var(--text); }
  .day-nav-arrow[hidden] { visibility: hidden; pointer-events: none; display: flex; }
  .day-nav-center { flex: 1; min-width: 0; text-align: center; cursor: default; }
  .top-date-label { font-size: 12px; color: var(--text-muted); margin: 0 0 3px; font-weight: 500; letter-spacing: 0.02em; }
  .top-date { font-size: 33px; line-height: 1.15; margin: 0; }
  .day-nav-sub { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 9px; min-height: 26px; }
  .day-status-note { font-size: 12px; color: var(--text-muted); }
  .day-today-btn, .day-review-btn, .day-view-btn {
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 100px;
    cursor: pointer;
    font-family: inherit;
  }
  .day-today-btn { color: var(--gold); background: rgba(var(--gold-rgb),0.12); border: 1px solid rgba(var(--gold-rgb),0.3); }
  .day-review-btn { color: var(--text-muted); background: none; border: 1px solid var(--border-soft); }
  main { padding: 0 20px calc(96px + env(safe-area-inset-bottom)); flex: 1 0 auto; }
  section.view { display: none; animation: fadein 0.18s ease; }
  section.view.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

  h2.section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin: 22px 0 10px;
  }
  h2.section-title:first-child { margin-top: 2px; }
  h2.section-title.tight { margin-top: 14px; margin-bottom: 8px; }
  h2.section-title.loose { margin-top: 30px; }

  .section-kicker {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin: 22px 0 8px;
  }
  .section-kicker:first-child { margin-top: 2px; }

  /* ---------- shared action button system ---------- */
  .btn-primary, .save-btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--gold);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
  }
  .btn-primary:active, .save-btn:active { transform: scale(0.98); background: var(--gold-soft); }
  .btn-secondary, .custom-log-btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .btn-secondary:active, .custom-log-btn:active { background: var(--panel); }
  .btn-link {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 0;
  }
  .btn-link:active { opacity: 0.7; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row > * { flex: 1; margin-top: 0; }

  .quicklog-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    overflow: hidden;
    max-height: 800px;
    opacity: 1;
    transition: max-height 0.22s ease, opacity 0.18s ease;
  }
  .quicklog-grid.collapsed { max-height: 0; opacity: 0; }

  .section-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: none;
    border: none;
    padding: 8px 2px;
    margin: 22px 0 8px;
    font-family: inherit;
    cursor: pointer;
    color: var(--text);
  }
  .section-toggle:first-child { margin-top: 2px; }
  .section-toggle:active { opacity: 0.75; }
  .section-toggle-label { font-size: 15px; font-weight: 600; color: var(--text); }
  .section-toggle-chevron { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; transition: transform 0.2s ease; }
  .section-toggle-chevron svg { width: 100%; height: 100%; display: block; }
  .section-toggle[aria-expanded="true"] .section-toggle-chevron { transform: rotate(180deg); }
  .quicklog-card {
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 11px 12px;
    text-align: left;
    cursor: pointer;
    background: var(--panel);
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: auto;
    transition: transform 0.12s ease, background 0.12s ease;
    font-family: inherit;
  }
  .quicklog-card:active { transform: scale(0.97); background: var(--panel-raised); }
  .quicklog-card .ql-icon {
    width: 32px; height: 32px;
    flex-shrink: 0;
    border-radius: 50%;
    padding: 7px;
    background: var(--tile-soft, var(--panel-raised));
    color: var(--tile-color, var(--text-muted));
  }
  .quicklog-card .ql-icon svg { width: 100%; height: 100%; display: block; }
  .quicklog-card .ql-label { font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--text); }
  .quicklog-card.padel { --tile-color: var(--padel); --tile-soft: var(--padel-soft); }
  .quicklog-card.resistance { --tile-color: var(--resistance); --tile-soft: var(--resistance-soft); }
  .quicklog-card.cardio { --tile-color: var(--cardio); --tile-soft: var(--cardio-soft); }
  .quicklog-card.yoga { --tile-color: var(--yoga); --tile-soft: var(--yoga-soft); }
  .quicklog-card.weight { --tile-color: var(--weight); --tile-soft: var(--weight-soft); }
  .quicklog-card.photo { --tile-color: var(--photo); --tile-soft: var(--photo-soft); }
  .quicklog-card.nutrition { --tile-color: var(--nutrition); --tile-soft: var(--nutrition-soft); }
  .quicklog-card.span-2 { grid-column: 1 / -1; }

  .custom-log-btn { margin-top: 10px; }

  .session-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    background: var(--panel);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .session-item:active { transform: scale(0.985); background: var(--panel-raised); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.padel { background: var(--padel); }
  .dot.resistance { background: var(--resistance); }
  .dot.cardio { background: var(--cardio); }
  .dot.yoga { background: var(--yoga); }
  .dot.weight { background: var(--weight); }
  .dot.photo { background: var(--photo); }
  .dot.nutrition { background: var(--nutrition); }
  .dot.gluten { background: var(--gluten); }
  .session-item .si-main { flex: 1; min-width: 0; }
  .session-item .si-type { font-size: 13px; font-weight: 600; text-transform: capitalize; }
  .session-item .si-detail { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .si-time { font-size: 12px; color: var(--text-faint); flex-shrink: 0; }

  .empty-state {
    padding: 10px 2px;
    text-align: left;
    color: var(--text-faint);
    font-size: 13px;
  }
  .empty-state.compact { padding: 6px 2px; font-size: 12.5px; }

  /* Calendar */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav button {
    background: none;
    border: 1px solid var(--border-soft);
    color: var(--text-muted);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
  }
  .cal-month-label { font-size: 17px; font-weight: 600; font-family: 'Fraunces', Georgia, serif; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-dow { text-align: center; font-size: 11px; color: var(--text-faint); padding-bottom: 6px; }
  .cal-cell {
    position: relative;
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 13px;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid transparent;
    color: var(--text-muted);
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .cal-cell:active { transform: scale(0.94); }
  .cal-cell.empty { background: transparent; cursor: default; }
  .cal-cell.empty:active { transform: none; }
  .cal-cell.today { background: var(--panel-raised); color: var(--gold); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(var(--gold-rgb),0.5); }
  .cal-cell.selected { background: var(--gold); color: var(--ink); font-weight: 600; }
  .cal-cell.status-completed { box-shadow: inset 0 0 0 1px rgba(var(--day-good-rgb),0.55); }
  .cal-cell.status-partial { box-shadow: inset 0 0 0 1px rgba(var(--day-neutral-rgb),0.55); }
  .cal-cell.status-disrupted { box-shadow: inset 0 0 0 1px rgba(var(--day-bad-rgb),0.5); }
  .cal-cell .cal-action-mark { position: absolute; top: 4px; right: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
  .cal-cell.selected .cal-action-mark { background: var(--ink); opacity: 0.5; }
  .cal-cell .cal-dots { display: flex; gap: 2px; height: 6px; }
  .cal-cell .cal-dots .dot { width: 5px; height: 5px; }
  .cal-day-detail { margin-top: 20px; }
  .cal-day-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 16px 0 6px; }
  .cal-day-section-title:first-child { margin-top: 0; }
  .cal-day-outcome { font-size: 12.5px; color: var(--text-muted); }
  .cal-day-outcome strong { color: var(--text); }
  .day-view-btn { color: var(--text-muted); background: none; border: 1px solid var(--border-soft); display: inline-block; margin-top: 10px; }
  .cal-summary {
    background: var(--panel);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    gap: 18px;
  }
  .cal-day-log-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .cal-day-log-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 10px 4px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: none;
    cursor: pointer;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .cal-day-log-btn:active { transform: scale(0.95); }
  .cal-day-log-btn .dot { width: 16px; height: 16px; border-radius: 5px; }

  .plan-day-row {
    background: var(--panel);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .plan-day-row.today { background: var(--panel-raised); box-shadow: inset 3px 0 0 var(--gold); }
  .plan-day-row-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .plan-day-row-head .day-label { font-size: 14px; font-weight: 600; color: var(--text); }
  .plan-day-row-head .today-tag { font-size: 10.5px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.04em; }
  .plan-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .plan-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 100px;
    background: var(--panel-raised);
    color: var(--text);
  }
  .plan-chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--chip-color, var(--text-faint)); }
  .plan-chip.outline {
    background: none;
    border: 1px solid var(--border-soft);
    color: var(--text-muted);
    padding: 3px 9px;
  }
  .plan-chip.outline::before { display: none; }
  .plan-roadblock {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--danger);
  }
  .plan-day-actions-chip {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 100px;
    background: none;
    border: 1px solid var(--border-soft);
    color: var(--text-muted);
  }
  .plan-meals-preview {
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .plan-empty-row { color: var(--text-faint); font-size: 13px; }
  .rest-day-toggle {
    width: 100%;
    padding: 11px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: var(--panel-raised);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .rest-day-toggle.sel { border-color: var(--text-faint); color: var(--text); background: var(--border); }
  .type-chip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .type-chip-btn {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 14px 4px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-soft);
    background: var(--panel-raised);
    cursor: pointer;
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .type-chip-btn:active { transform: scale(0.95); }
  .type-chip-btn .dot { width: 20px; height: 20px; border-radius: 50%; }

  .today-plan-widget {
    background: var(--panel);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 18px;
  }
  .today-plan-widget .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 10px; }
  .today-plan-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600;
    padding: 5px 12px;
    border-radius: 100px;
    background: var(--panel-raised);
    color: var(--text);
    margin: 0 6px 6px 0;
    cursor: pointer;
  }
  .today-plan-chip .dot { background: var(--chip-color, var(--text-faint)); width: 7px; height: 7px; }

  .commitment-group-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    margin: 14px 0 6px;
    padding: 0 2px;
  }
  .commitment-group-title:first-child { margin-top: 0; }
  .commitment-group-title.roadblock { color: var(--danger); }

  .commitment-item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 12px 13px;
    background: var(--panel);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .commitment-item:active { transform: scale(0.99); background: var(--panel-raised); }
  .commitment-item.roadblock { box-shadow: inset 3px 0 0 rgba(var(--danger-rgb),0.6); background: rgba(var(--danger-rgb),0.07); }
  .commitment-status-dot {
    width: 20px; height: 20px;
    margin: -4px -5px -4px -3px;
    padding: 5px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    cursor: pointer;
  }
  .commitment-status-dot::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--dot-color, var(--gold)); }
  .commitment-status-dot:active { background: var(--panel-raised); }
  .commitment-status-dot.planned { --dot-color: var(--gold); }
  .commitment-status-dot.completed { --dot-color: var(--day-good); }
  .commitment-status-dot.partial { --dot-color: var(--day-neutral); }
  .commitment-status-dot.disrupted { --dot-color: var(--text-faint); }
  .commitment-status-dot.not_done { --dot-color: var(--text-faint); }
  .commitment-status-dot.roadblock { --dot-color: var(--danger); }
  .commitment-title { font-size: 14px; color: var(--text); font-weight: 500; }
  .commitment-title.completed { text-decoration: line-through; opacity: 0.6; }
  .commitment-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .commitment-minver { font-size: 12px; color: var(--gold); margin-top: 3px; }
  .commitment-train-link {
    flex-shrink: 0;
    align-self: center;
    background: none;
    border: 1px solid var(--border-soft);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 7px 11px;
    border-radius: 100px;
    cursor: pointer;
  }
  .commitment-train-link:active { background: var(--panel-raised); }

  .status-btn-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 14px; }
  .status-btn {

  }
  .status-btn.sel.completed { border-color: var(--day-good); color: var(--day-good); background: rgba(var(--day-good-rgb),0.14); }
  .status-btn.sel.partial { border-color: var(--day-neutral); color: var(--day-neutral); background: rgba(var(--day-neutral-rgb),0.14); }
  .status-btn.sel.disrupted { border-color: var(--text-faint); color: var(--text); background: var(--border); }
  .status-btn.sel.not_done { border-color: var(--text-faint); color: var(--text); background: var(--border); }

  .accountability-box {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 16px 0 18px;
    padding: 14px 2px 0;
    border-top: 1px solid var(--border-soft);
    line-height: 1.6;
  }
  .accountability-box > div + div { margin-top: 3px; }

  .catchup-banner {
    background: var(--panel-raised);

    margin-bottom: 18px;

  .catchup-day-row {

  .catchup-day-row:last-child { border-bottom: none; }
  .catchup-day-label { font-size: 13.5px; font-weight: 600; flex-shrink: 0; }
  .catchup-status-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .catchup-status-btn {
    padding: 6px 10px;
    border-radius: 100px;
    border: 1px solid var(--border-soft);
    background: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Stats */
  .stat-card {
    background: var(--panel);
    border-radius: var(--radius-md);
    padding: 18px;
    margin-bottom: 10px;
  }
  .stat-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .stat-card-head .dot { width: 7px; height: 7px; }
  .stat-card-head .name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
  .stat-card-clickable { cursor: pointer; transition: transform 0.1s ease, background 0.1s ease; }
  .stat-card-clickable:active { transform: scale(0.99); background: var(--panel-raised); }
  .stat-card-chevron { margin-left: auto; color: var(--text-faint); font-size: 16px; }
  .stat-row { display: flex; gap: 20px; }
  .stat-num { flex: 1; }

  .weekbar { margin-bottom: 22px; }
  .weekbar-bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; margin-top: 10px; }
  .weekbar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .weekbar-stack { width: 100%; max-width: 26px; display: flex; flex-direction: column-reverse; border-radius: 4px; overflow: hidden; }
  .weekbar-seg { width: 100%; height: 14px; }

  /* Tab bar */
  nav.tabbar {
    position: sticky;
    bottom: 0;

    border-top: 1px solid var(--border-soft);

  nav.tabbar button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: inherit;

  nav.tabbar button .tab-icon { width: 22px; height: 22px; transition: transform 0.15s cubic-bezier(.34,1.56,.64,1); }
  nav.tabbar button .tab-icon svg { width: 100%; height: 100%; display: block; }
  nav.tabbar button.active { color: var(--gold); }

  /* Global quick add */
  .global-fab {
    position: fixed;

  }
  .global-fab:active { transform: scale(0.92); }

  /* ---------- chips (shared) ---------- */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 100px;
    line-height: 1.3;
  }
  .chip .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--chip-color, var(--text-faint)); }
  .chip.chip-neutral { background: var(--panel-raised); border: 1px solid var(--border-soft); color: var(--text); }
  .chip.chip-outline { background: none; border: 1px solid var(--border-soft); color: var(--text-muted); }

  /* ---------- quick capture ---------- */
  .qc-rows { margin-bottom: 4px; }
  .qc-row { position: relative; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .qc-type-chip {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-width: 100px;
    padding: 12px 12px;
    border-radius: 100px;
    border: 1px solid var(--border-soft);
    background: var(--panel-raised);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .qc-type-chip .chip-dot { width: 8px; height: 8px; }
  .qc-type-chip:active { background: var(--border); }
  .qc-text-input {
    flex: 1;
    min-width: 0;
    background: var(--panel-raised);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 12px 12px;
    font-family: inherit;
    font-size: 14.5px;
  }
  .qc-text-input:focus { outline: none; border-color: var(--gold); }
  .qc-row-delete {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: none;
    color: var(--text-faint);
    font-size: 15px;
    cursor: pointer;
  }
  .qc-row-delete:active { background: var(--panel-raised); }
  .qc-type-popover {
    position: fixed;
    z-index: 60;
    background: var(--panel-raised);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-raised);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 168px;
    overflow-y: auto;
  }
  .qc-type-option {
    display: flex;
    align-items: center;
    gap: 9px;
    text-align: left;
    padding: 10px 10px;
    border-radius: var(--radius-sm);
    border: none;
    background: none;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .qc-type-option .chip-dot { width: 8px; height: 8px; }
  .qc-type-option:active { background: var(--panel); }
  .qc-target-note { font-size: 12px; color: var(--text-muted); margin: -6px 0 14px; }

  /* Sheet / modal */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 30;
    display: none;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    background: var(--panel);
    width: 100%;
    max-width: 560px;
    border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow-y: auto;
    border-top: 1px solid var(--border-soft);
    box-shadow: var(--shadow-raised);
    animation: sheet-up 0.2s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes sheet-up {
    from { transform: translateY(20px); opacity: 0.4; }
    to { transform: translateY(0); opacity: 1; }
  }
  .sheet-handle { width: 34px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sheet-title { font-size: 19px; font-weight: 600; text-transform: capitalize; font-family: 'Fraunces', Georgia, serif; }
  .sheet-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 11px 12px;
    font-family: inherit;
    font-size: 14.5px;
    transition: border-color 0.12s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--gold);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  input::placeholder, textarea::placeholder { color: var(--text-faint); opacity: 0.8; }
  .exercise-row input::placeholder { color: var(--text-faint); opacity: 0.8; }
  .field-row { display: flex; gap: 10px; }
  .time-with-now { display: flex; gap: 6px; }
  .time-with-now input { flex: 1; min-width: 0; }
  .time-with-now button {
    flex-shrink: 0;
    padding: 0 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: var(--panel-raised);
    color: var(--gold);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .time-with-now button:active { background: var(--border); }
  .field-row .field { flex: 1; }

  .seg-toggle { display: flex; gap: 8px; }
  .seg-toggle button {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: var(--panel-raised);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .seg-toggle button.sel { border-color: var(--gold); color: var(--gold); background: rgba(var(--gold-rgb),0.1); }

  #dayRatingToggle button[data-v="good"].sel { border-color: var(--day-good); color: var(--day-good); background: rgba(var(--day-good-rgb),0.14); }
  #dayRatingToggle button[data-v="neutral"].sel { border-color: var(--day-neutral); color: var(--day-neutral); background: rgba(var(--day-neutral-rgb),0.14); }
  #dayRatingToggle button[data-v="off-track"].sel { border-color: var(--day-bad); color: var(--day-bad); background: rgba(var(--day-bad-rgb),0.14); }

  .exercise-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .exercise-row input { flex: 1; min-width: 0; }
  .exercise-row input.ex-name { flex-basis: 100%; }
  .exercise-row select.ex-unit { flex: 0 0 72px; font-size: 13px; padding: 10px 6px; }
  .exercise-row .ex-rm { background: none; border: none; color: var(--text-faint); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .simple-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: nowrap; }
  .simple-row input { flex: 1; min-width: 0; }
  .simple-row .ex-rm { background: none; border: none; color: var(--text-faint); font-size: 18px; cursor: pointer; padding: 0 4px; flex-shrink: 0; }
  .add-exercise-btn {
    width: 100%; padding: 10px; border-radius: var(--radius-sm);
    border: 1px dashed var(--border-soft); background: none; color: var(--text-muted);
    font-family: inherit; font-size: 13px; cursor: pointer; margin-bottom: 6px;
  }

  .si-thumb { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .photo-preview-wrap { margin-bottom: 14px; }
  .photo-preview-wrap img { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--radius-sm); display: block; }

  .sparkline { display: block; margin-top: 4px; }
  .detail-chart-wrap { margin-bottom: 18px; }
  .detail-chart-wrap svg { width: 100%; height: 120px; display: block; }
  .detail-trend { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  .detail-trend strong { color: var(--text); }

  .player-card {
    background: linear-gradient(150deg, var(--panel-raised), var(--panel));
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .avatar-ring-wrap { position: relative; width: 70px; height: 70px; flex-shrink: 0; cursor: pointer; transition: transform 0.12s ease; }
  .avatar-ring-wrap:active { transform: scale(0.94); }
  .avatar-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .avatar-ring-bg { fill: none; stroke: var(--border); stroke-width: 4; }
  .avatar-ring-fg { fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }
  .avatar-figure {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-figure svg { width: 44px; height: 44px; }
  .avatar-level-chip {
    position: absolute; bottom: -2px; right: -2px;
    width: 21px; height: 21px;
    border-radius: 50%;
    border: 2px solid var(--panel);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 11px; font-weight: 600; color: var(--ink);
  }
  .player-info { flex: 1; min-width: 0; }
  .player-rank { font-size: 15px; font-weight: 600; color: var(--text); font-family: 'Fraunces', Georgia, serif; }
  .player-xp-text { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .xp-bar-track { width: 100%; height: 5px; background: var(--border); border-radius: 100px; margin-top: 9px; overflow: hidden; }
  .xp-bar-fill { height: 100%; border-radius: 100px; transition: width 0.4s ease; }
  .streak-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 500; color: var(--text-muted);
    margin-top: 8px;
  }

  .focus-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 14px;
    background: var(--panel);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    cursor: pointer;
  }
  .focus-item.done { opacity: 0.5; }
  .focus-item.done .focus-text { text-decoration: line-through; }
  .focus-tag {
    display: inline-flex; align-items: center; gap: 5px;
    flex-shrink: 0;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 3px 9px 3px 7px;
    border-radius: 100px;
    background: var(--panel-raised);
    border: 1px solid var(--border-soft);
    color: var(--text-muted);
    white-space: nowrap;
    margin-top: 1px;
  }
  .focus-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .focus-tag.technique::before { background: var(--cardio); }
  .focus-tag.footwork::before { background: var(--gold); }
  .focus-tag.physical::before { background: var(--resistance); }
  .focus-tag.general::before { background: var(--weight); }
  .focus-text { font-size: 14px; color: var(--text); flex: 1; }

  .target-weight-card {
    background: var(--panel);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 4px;
    cursor: pointer;
  }
  .target-weight-row { display: flex; gap: 18px; }
  .target-weight-row .stat-num .val { font-size: 30px; line-height: 1; font-weight: 500; }
  .target-weight-row .stat-num .lbl { font-size: 11.5px; color: var(--text-muted); margin-top: 5px; }

  .checkbox-field { display: flex; align-items: center; background: var(--panel-raised); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 12px; }
  .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); cursor: pointer; margin-bottom: 0 !important; }
  .checkbox-label input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
  .cb-box {
    width: 20px; height: 20px; flex-shrink: 0;
    border: 1.5px solid var(--text-faint);
    border-radius: 6px;
    background: var(--panel);
    position: relative;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .checkbox-label input:checked + .cb-box { background: var(--gold); border-color: var(--gold); }
  .cb-box::after {
    content: '';
    position: absolute;
    left: 50%; top: 44%;
    width: 5px; height: 9px;
    border: solid var(--ink);
    border-width: 0 2px 2px 0;
    transform: translate(-50%, -50%) rotate(45deg);
    opacity: 0;
  }
  .checkbox-label input:checked + .cb-box::after { opacity: 1; }

  .save-btn { margin-top: 8px; }
  .delete-btn, .btn-danger {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(var(--danger-rgb),0.4);
    background: none;
    color: var(--danger);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.1s ease;
  }
  .delete-btn:active, .btn-danger:active { background: rgba(var(--danger-rgb),0.1); }

  .sync-note { font-size: 11px; color: var(--text-faint); text-align: center; margin: 18px 0 4px; }
</style>
</head>
<body>

<header class="top">
  <div class="day-nav">
    <button class="day-nav-arrow" id="dayPrevBtn" aria-label="Previous day">‹</button>
    <div class="day-nav-center" id="dayNavCenter">
      <p class="top-date-label" id="topDateLabel">—</p>
      <h1 class="top-date display" id="topDate">—</h1>
    </div>
    <button class="day-nav-arrow" id="dayNextBtn" aria-label="Next day" hidden>›</button>
  </div>
  <div class="day-nav-sub" id="dayNavSub"></div>
</header>

<main>

  <section class="view active" id="view-log">
    <div id="catchUpBanner"></div>

    <h2 class="section-title">Actions</h2>
    <div id="commitmentsList"></div>
    <button class="btn-primary" id="quickCaptureBtn">+ Quick add</button>
    <button class="btn-link" id="addCommitmentBtn">+ Add with detail</button>

    <div id="accountabilityMsg"></div>

    <div id="todayPlanWidget"></div>

    <button type="button" class="section-toggle" id="quickLogToggle" aria-expanded="false" aria-controls="quickLogGrid">
      <span class="section-toggle-label">Quick log</span>
      <span class="section-toggle-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
    </button>
    <div class="quicklog-grid collapsed" id="quickLogGrid">
      <button class="quicklog-card nutrition span-2" data-type="nutrition">
        <span class="ql-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5v7a2.5 2.5 0 0 0 5 0v-7"/><line x1="8.5" y1="2.5" x2="8.5" y2="21.5"/><path d="M17 2.5c-1.5 1-2.3 3-2.3 5.3 0 2.6 1.3 4 2.3 4.7v9"/></svg></span>
        <span class="ql-label">Nutrition</span>
      </button>
      <button class="quicklog-card weight" data-type="weight">
        <span class="ql-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c0-2.5 1.5-4 3.5-4s3.5 1.5 3.5 4"/><line x1="12" y1="7" x2="12" y2="8.5"/></svg></span>
        <span class="ql-label">Weight</span>
      </button>
      <button class="quicklog-card photo" data-type="photo">
        <span class="ql-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.3"/></svg></span>
        <span class="ql-label">Daily photo</span>

  function fmtDate(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+da;
  }
  function niceDate(d){
    return d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
  }
  function niceTime(iso){
    try { return new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); } catch(e){ return ''; }
  }
  function niceActivityTime(hhmm){
    if (!hhmm) return '';
    try {
      var parts = hhmm.split(':');
      var d = new Date(); d.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
      return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    } catch(e){ return ''; }
  }

  async function initDb(){
    try {
      if (firebaseConfig.apiKey === "YOUR_API_KEY") { fallbackMode(); return; }
      firebase.initializeApp(firebaseConfig);
      dbRef = firebase.firestore();
      dbReady = true;
      document.getElementById('syncNote').textContent = '';
      dbRef.collection('ledger_sessions').orderBy('date','desc')
        .onSnapshot(function(snap){
          sessions = snap.docs.map(function(d){ var data = d.data() || {}; data.id = d.id; return normalizeSession(data); });
          renderAll();
        }, function(err){
          console.error('firestore snapshot error', err);
          fallbackMode();
        });
      dbRef.collection('ledger_meta').doc('presets').onSnapshot(function(doc){
        if (doc.exists){
          var data = doc.data();
          presets.cardioTypes = data.cardioTypes || DEFAULT_CARDIO_TYPES.slice();
          presets.exercises = data.exercises || DEFAULT_EXERCISES.slice();
          presets.targetWeightKg = data.targetWeightKg != null ? data.targetWeightKg : null;
          presets.prioritiesSeeded = !!data.prioritiesSeeded;
          if (currentView === 'focus') renderFocus();
        } else {
          dbRef.collection('ledger_meta').doc('presets').set(presets).catch(function(){});
        }
        presetsLoaded = true;
        seedPrioritiesIfNeeded();
      }, function(err){ console.error('presets snapshot error', err); });
      dbRef.collection('ledger_focus').orderBy('createdAt','desc')
        .onSnapshot(function(snap){
          focusItems = snap.docs.map(function(d){ var data = d.data() || {}; data.id = d.id; return data; });
          if (currentView === 'focus') renderFocus();
        }, function(err){ console.error('focus snapshot error', err); });
      dbRef.collection('ledger_plans')
        .onSnapshot(function(snap){
          plans = snap.docs.map(function(d){ var data = d.data() || {}; data.date = d.id; return data; });
          if (currentView === 'plan') renderPlan();
          renderLogView();
        }, function(err){ console.error('plans snapshot error', err); });
      dbRef.collection('ledger_meals').orderBy('createdAt','desc')
        .onSnapshot(function(snap){
          mealIdeas = snap.docs.map(function(d){ var data = d.data() || {}; data.id = d.id; return data; });
          if (currentView === 'plan') renderMealIdeas();
        }, function(err){ console.error('meal ideas snapshot error', err); });
      dbRef.collection('ledger_priorities').orderBy('createdAt')
        .onSnapshot(function(snap){
          priorities = snap.docs.map(function(d){ var data = d.data() || {}; data.id = d.id; return data; });
          prioritiesLoaded = true;
          seedPrioritiesIfNeeded();
          if (currentView === 'focus') renderPriorities();
        }, function(err){ console.error('priorities snapshot error', err); });
      dbRef.collection('ledger_commitments')
        .onSnapshot(function(snap){
          commitments = snap.docs.map(function(d){ var data = d.data() || {}; data.id = d.id; return data; });
          renderLogView();
        }, function(err){ console.error('commitments snapshot error', err); });
      dbRef.collection('ledger_day_status')
        .onSnapshot(function(snap){
          dayStatuses = snap.docs.map(function(d){ var data = d.data() || {}; data.date = d.id; return data; });
          renderLogView();
        }, function(err){ console.error('day status snapshot error', err); });
    } catch(e){
      console.error(e);
      fallbackMode();
    }
  }

  function fallbackMode(){
    dbReady = false;
    localLoad();
    localLoadPresets();
    localLoadFocus();
    localLoadPlans();
    localLoadMealIdeas();
    localLoadPriorities();
    localLoadCommitments();
    localLoadDayStatuses();
    presetsLoaded = true;
    prioritiesLoaded = true;
    seedPrioritiesIfNeeded();
    document.getElementById('syncNote').textContent = 'Saving on this device only — add your Firebase config to sync';
    renderAll();
  }

  async function savePresets(){
    if (dbReady && dbRef){
      try { await dbRef.collection('ledger_meta').doc('presets').set(presets); return; }
      catch(e){ console.error('presets save failed', e); }
    }
    localSavePresets();
  }

  async function saveFocusItem(item){
    if (dbReady && dbRef){
      try {
        if (item.id){
          var id = item.id; var copy = Object.assign({}, item); delete copy.id;
          await dbRef.collection('ledger_focus').doc(id).set(copy);
        } else {
          await dbRef.collection('ledger_focus').add(item);
        }
        return;
      } catch(e){ console.error('focus save failed', e); }
    }
    if (item.id){
      var idx = focusItems.findIndex(function(f){ return f.id === item.id; });
      if (idx > -1) focusItems[idx] = item;
    } else {
      item.id = uid();
      focusItems.unshift(item);
    }
    localSaveFocus();
    renderFocus();
  }

  async function deleteFocusItem(id){
    if (dbReady && dbRef){
      try { await dbRef.collection('ledger_focus').doc(id).delete(); return; }
      catch(e){ console.error(e); }
    }
    focusItems = focusItems.filter(function(f){ return f.id !== id; });
    localSaveFocus();
    renderFocus();
  }

    return plans.find(function(p){ return p.date === dateStr; }) || null;
  }

    data.date = dateStr;
    if (dbReady && dbRef){
      try {
        var copy = Object.assign({}, data); delete copy.date;
        await dbRef.collection('ledger_plans').doc(dateStr).set(copy);
        return;
      } catch(e){ console.error('plan save failed', e); }
    }
    var idx = plans.findIndex(function(p){ return p.date === dateStr; });
    if (idx > -1) plans[idx] = data; else plans.push(data);
    localSavePlans();
    renderPlan();
    renderLogView();
  }

      try { await dbRef.collection('ledger_plans').doc(dateStr).delete(); return; }

    renderLogView();

      try {

          var id = data.id; var copy = Object.assign({}, data); delete copy.id;
          await dbRef.collection('ledger_sessions').doc(id).set(copy);
        } else {
          await dbRef.collection('ledger_sessions').add(data);
        }
        return;
      } catch(e){ console.error('save failed, falling back', e); }
    }
    // local fallback
    if (data.id){
      var idx = sessions.findIndex(function(s){ return s.id === data.id; });
      if (idx > -1) sessions[idx] = data;
    } else {
      data.id = uid();
      sessions.unshift(data);
    }
    localSave();
    renderAll();
  }

  // ---------- log view ----------
  function sessionDetailText(s){
    if (s.type === 'padel'){
      var parts = [];
      if (s.padelType && s.padelType !== 'match') parts.push(s.padelType.charAt(0).toUpperCase() + s.padelType.slice(1));
      if (s.padelType === 'match' || !s.padelType){
        if (s.result) parts.push(s.result === 'win' ? 'Won' : s.result === 'loss' ? 'Lost' : 'Played');
        if (s.sets && s.sets.length){
          parts.push(s.sets.map(function(st){ return st.yourGames + '-' + st.oppGames; }).join(', '));
        } else if (s.gamesWon != null && s.gamesLost != null) {
          parts.push(s.gamesWon + '–' + s.gamesLost);
        }
      }
      if (s.players && s.players.filter(Boolean).length){
        parts.push('w/ ' + s.players.filter(Boolean).join(', '));
      } else if (s.opponent) {
        parts.push('vs ' + s.opponent);
      }
      if (s.venue) parts.push('@ ' + s.venue);
      return parts.join(' · ') || 'Session logged';
    }
    if (s.type === 'resistance'){
      var n = (s.exercises||[]).length;
      return n ? n + ' exercise' + (n===1?'':'s') + (s.bodyweight ? ' · ' + s.bodyweight + 'kg' : '') : 'Session logged';
    }
    if (s.type === 'cardio'){
      var bits = [];
      if (s.cardioType) bits.push(s.cardioType);
      if (s.distance) bits.push(s.distance + ' ' + (s.distanceUnit || 'km'));
      if (s.durationMin) bits.push(s.durationMin + ' min');
      return bits.join(' · ') || 'Session logged';
    }
    if (s.type === 'yoga'){
      var b2 = [];
      if (s.focus) b2.push(s.focus);
      if (s.durationMin) b2.push(s.durationMin + ' min');
      return b2.join(' · ') || 'Session logged';
    }
    if (s.type === 'weight'){
      return s.weightKg ? s.weightKg + ' kg' : 'Weight logged';
    }
    if (s.type === 'photo'){
      return s.notes || 'Photo added';
    }
    if (s.type === 'nutrition'){
      var nb = [];
      if (s.dayRating) nb.push(DAY_RATING_LABEL[s.dayRating] + ' day');
      if (s.calories) nb.push(s.calories + ' kcal');
      if (s.glutenFree) nb.push('GF');
      if (s.minimalProcessed) nb.push('Minimal processed');
      if (s.sufficientWater) nb.push('Hydrated' + (s.waterAmount ? ' (' + s.waterAmount + ')' : ''));
      if (s.glutenExposure){
        var gb = ['Gluten exposure'];
        if (s.glutenSeverity) gb.push(SEVERITY_LABEL[s.glutenSeverity]);
        if (s.glutenSymptoms && s.glutenSymptoms.length) gb.push(s.glutenSymptoms.join(', '));
        nb.push(gb.join(' — '));
      }
      return nb.join(' · ') || 'Day logged';
    }
    if (s.type === 'gluten'){
      // legacy entries from before gluten tracking moved into Nutrition
      var gb2 = [];
      if (s.source) gb2.push(s.source);
      if (s.severity) gb2.push(SEVERITY_LABEL[s.severity]);
      if (s.symptoms && s.symptoms.length) gb2.push(s.symptoms.join(', '));
      return gb2.join(' · ') || 'Exposure logged';
    }
    return s.notes || '';
  }

  // ---------- today's commitments ----------
  // Fast capture lanes used by Quick Capture. Not a permanent taxonomy —
  // just enough structure to classify a thought in one tap.
  var QUICK_CAPTURE_CATEGORIES = [
    { key: 'success', label: 'Success', color: 'var(--day-good)' },
    { key: 'work', label: 'Work', color: 'var(--weight)' },
    { key: 'communicate', label: 'Communicate', color: 'var(--cardio)' },
    { key: 'family', label: 'Family', color: 'var(--yoga)' },
    { key: 'personal', label: 'Personal', color: 'var(--photo)' },
    { key: 'training', label: 'Training', color: 'var(--resistance)' },
    { key: 'roadblock', label: 'Roadblock', color: 'var(--danger)' }
  ];
  var QUICK_CAPTURE_CATEGORY_MAP = {};
  QUICK_CAPTURE_CATEGORIES.forEach(function(c){ QUICK_CAPTURE_CATEGORY_MAP[c.key] = c; });

  // Priorities don't (yet) carry a short display/group name, so derive a
  // compact label from the title rather than showing the full sentence.
  function priorityGroupLabel(p){
    var title = (p && p.title || '').trim();
    if (!title) return 'Other';
    if (p.groupName) return p.groupName;
    var seg = title.split(/\s[-–—]\s|:\s*/)[0].trim();
    if (seg.length > 24){
      var words = seg.split(/\s+/);
      var out = '';
      for (var i=0;i<words.length;i++){
        var next = out ? out + ' ' + words[i] : words[i];
        if (next.length > 22) break;
        out = next;
      }
      seg = (out || words[0].slice(0,22)) + '…';
    }
    return seg;
  }

  function toggleCommitmentQuickStatus(c){
    var next = c.status === 'completed' ? 'planned' : 'completed';
    saveCommitment(Object.assign({}, c, { status: next }));

  function buildCommitmentRow(c){
    var isRoadblock = c.category === 'roadblock';
    var row = document.createElement('div');
    row.className = 'commitment-item' + (isRoadblock ? ' roadblock' : '');
    var metaParts = [];
    if (c.status !== 'planned') metaParts.push(COMMITMENT_STATUS_LABEL[c.status]);
    if (c.status === 'disrupted' && c.disruptionReason) metaParts.push(c.disruptionReason);
    var showMinVer = c.minVersion && c.status !== 'completed';
    row.innerHTML =
      '<span class="commitment-status-dot ' + (isRoadblock ? 'roadblock' : c.status) + '"></span>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="commitment-title' + (c.status==='completed'?' completed':'') + '">' + c.title + '</div>' +
        (metaParts.length ? '<div class="commitment-meta">' + metaParts.join(' · ') + '</div>' : '') +
        (showMinVer ? '<div class="commitment-minver">Minimum: ' + c.minVersion + '</div>' : '') +
      '</div>';
    row.addEventListener('click', function(){ openCommitmentSheet(c); });
    if (!isRoadblock){
      row.querySelector('.commitment-status-dot').addEventListener('click', function(e){

      });

    if (c.category === 'training'){

      trainBtn.className = 'commitment-train-link';
      trainBtn.textContent = 'Log';
      trainBtn.addEventListener('click', function(e){

        expandQuickLog();
      });
      row.appendChild(trainBtn);
    }
    return row;
  }

  function renderCommitments(){
    var list = document.getElementById('commitmentsList');
    if (!list) return;
    var dateStr = viewedDate;
    var todays = commitments.filter(function(c){ return c.date === dateStr; });
    list.innerHTML = '';
    if (!todays.length){
      var e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = dateStr === todayStr() ? 'Nothing planned yet' : 'No actions recorded';
      list.appendChild(e);
      return;
    }

    // Roadblocks are risks/constraints, not tasks to complete — surface them
    // separately, above the actionable groups.
    var roadblocks = todays.filter(function(c){ return c.category === 'roadblock'; });
    var actionable = todays.filter(function(c){ return c.category !== 'roadblock'; });

    if (roadblocks.length){
      var rbHeading = document.createElement('div');
      rbHeading.className = 'commitment-group-title roadblock';
      rbHeading.textContent = 'Roadblocks';
      list.appendChild(rbHeading);
      roadblocks.forEach(function(c){ list.appendChild(buildCommitmentRow(c)); });
    }

    // Group by linked priority first (in priority list order); anything left
    // over is grouped by its Quick Capture category, or "Other" if neither applies.
    var groups = [];
    var grouped = {};
    priorities.forEach(function(p){
      var items = actionable.filter(function(c){ return c.priorityId === p.id; });
      if (items.length){
        groups.push({ label: priorityGroupLabel(p), items: items });
        items.forEach(function(c){ grouped[c.id] = true; });
      }
    });
    var remaining = actionable.filter(function(c){ return !grouped[c.id]; });
    var catGroups = [];
    var catIndex = {};
    remaining.forEach(function(c){
      var catKey = (c.category && QUICK_CAPTURE_CATEGORY_MAP[c.category]) ? c.category : '__other__';
      if (!catIndex[catKey]){
        var g = { label: catKey === '__other__' ? 'Other' : QUICK_CAPTURE_CATEGORY_MAP[catKey].label, items: [] };
        catIndex[catKey] = g;
        catGroups.push(g);
      }
      catIndex[catKey].items.push(c);
    });
    catGroups.sort(function(a, b){
      if (a.label === 'Other') return 1;
      if (b.label === 'Other') return -1;
      return 0;
    });
    groups = groups.concat(catGroups);

    groups.forEach(function(g){
      var heading = document.createElement('div');
      heading.className = 'commitment-group-title';
      heading.textContent = g.label;
      list.appendChild(heading);
      g.items.forEach(function(c){ list.appendChild(buildCommitmentRow(c)); });
    });
  }

  function openCommitmentSheet(existing){
    editingId = null;
    var isEditing = !!existing;
    var statusVal = existing ? existing.status : 'planned';
    var disruptionVal = existing ? (existing.disruptionReason || null) : null;

    function buildHtml(){
      var priorityOptions = [{value:'', label:'No linked priority'}].concat(
        priorities.map(function(p){ return {value:p.id, label:p.title}; })
      );
      var html = '<div class="sheet-handle"></div>' +
        '<div class="sheet-head"><div class="sheet-title">' + (isEditing ? 'Edit action' : 'New action') + '</div><button class="sheet-close" id="sheetCloseBtn">✕</button></div>' +
        '<div class="field"><label>Action</label><input type="text" id="f_commitTitle" placeholder="e.g. Resistance training" value="' + (existing ? existing.title.replace(/"/g,'&quot;') : '') + '"></div>' +
        fieldSelect('f_commitPriority', 'Linked priority (optional)', priorityOptions, existing ? (existing.priorityId||'') : '') +
        '<div class="field"><label>Minimum version (optional)</label><input type="text" id="f_commitMinVer" placeholder="e.g. 20-minute home workout" value="' + (existing && existing.minVersion ? existing.minVersion.replace(/"/g,'&quot;') : '') + '"></div>';

      if (isEditing){
        html += '<div class="field"><label>Status</label><div class="status-btn-grid" id="commitStatusGrid">' +
          ['completed','partial','disrupted','not_done'].map(function(s){
            return '<button type="button" class="status-btn' + (statusVal===s?' sel '+s:'') + '" data-s="' + s + '">' + COMMITMENT_STATUS_LABEL[s] + '</button>';
          }).join('') +
        '</div></div>';
        html += '<div id="disruptionReasonField" style="' + (statusVal==='disrupted' ? '' : 'display:none') + '">' +
          fieldSelect('f_disruptionReason', 'Disruption reason (optional)', [{value:'',label:'Not specified'}].concat(DISRUPTION_REASONS.map(function(r){ return {value:r,label:r}; })), disruptionVal || '') +
        '</div>';
      }

      html += '<button class="save-btn" id="saveCommitBtn">Save</button>' +
        (isEditing ? '<button class="delete-btn" id="deleteCommitBtn">Delete</button>' : '');
      return html;
    }

    sheetEl.innerHTML = buildHtml();
    backdrop.classList.add('open');
    wireSheet();

    function wireSheet(){
      document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);
      if (isEditing){
        document.querySelectorAll('#commitStatusGrid .status-btn').forEach(function(btn){
          btn.addEventListener('click', function(){
            statusVal = btn.dataset.s;
            sheetEl.innerHTML = buildHtml();
            wireSheet();
          });
        });
        document.getElementById('deleteCommitBtn').addEventListener('click', function(){
          deleteCommitment(existing.id);
          closeSheet();
        });
      }
      document.getElementById('saveCommitBtn').addEventListener('click', function(){
        var title = document.getElementById('f_commitTitle').value.trim();
        if (!title) { closeSheet(); return; }
        var out = {
          date: existing ? existing.date : viewedDate,
          title: title,
          priorityId: document.getElementById('f_commitPriority').value || null,
          minVersion: document.getElementById('f_commitMinVer').value || null,
          status: isEditing ? statusVal : 'planned',
          disruptionReason: (isEditing && statusVal === 'disrupted') ? (document.getElementById('f_disruptionReason').value || null) : null,
          category: existing ? (existing.category || null) : null,
          createdAt: existing ? existing.createdAt : new Date().toISOString()
        };
        if (isEditing) out.id = existing.id;
        saveCommitment(out);
        closeSheet();
      });
    }
  }

  document.getElementById('addCommitmentBtn').addEventListener('click', function(){ openCommitmentSheet(null); });

  // ---------- quick capture (batch, low-friction, date-aware) ----------
  var qcRowSeq = 0;
  var qcRows = []; // {id, category}
  var qcLastCategory = 'work';
  var qcTargetDate = null;

  function dateNoteLabel(dateStr){
    if (dateStr === todayStr()) return null;
    var d = new Date(dateStr + 'T00:00:00');
    return 'Adding to ' + d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function openQuickCaptureSheet(targetDate){
    editingId = null;
    qcTargetDate = targetDate || viewedDate || todayStr();
    qcRows = [];
    qcRowSeq = 0;
    qcLastCategory = 'work';

    var note = dateNoteLabel(qcTargetDate);

      '<div class="sheet-handle"></div>' +

      (note ? '<div class="qc-target-note">' + note + '</div>' : '') +
      '<div class="qc-rows" id="qcRows"></div>' +

  function addQuickCaptureRow(focus){
    qcRowSeq++;
    var id = 'qc' + qcRowSeq;
    var category = qcLastCategory;
    qcRows.push({ id: id, category: category });

    var rowsWrap = document.getElementById('qcRows');
    var row = document.createElement('div');
    row.className = 'qc-row';
    row.dataset.id = id;
    var cat = QUICK_CAPTURE_CATEGORY_MAP[category];
    row.innerHTML =
      '<button type="button" class="qc-type-chip" data-id="' + id + '"><span class="chip-dot" style="--chip-color:' + cat.color + '"></span>' + cat.label + '</button>' +
      '<input type="text" class="qc-text-input" data-id="' + id + '" placeholder="What’s on your mind?" autocomplete="off">' +
      '<button type="button" class="qc-row-delete" data-id="' + id + '" aria-label="Remove row">✕</button>';
    rowsWrap.appendChild(row);

    var chip = row.querySelector('.qc-type-chip');
    var input = row.querySelector('.qc-text-input');
    var del = row.querySelector('.qc-row-delete');

    chip.addEventListener('click', function(e){
      e.stopPropagation();
      toggleQcCategoryPopover(chip, id);
    });

    input.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var isLast = qcRows.length && qcRows[qcRows.length - 1].id === id;
      if (isLast && input.value.trim()){
        addQuickCaptureRow(true);
      } else {
        var idx = qcRows.findIndex(function(r){ return r.id === id; });
        var next = qcRows[idx + 1];
        if (next){
          var nextInput = rowsWrap.querySelector('.qc-text-input[data-id="' + next.id + '"]');
          if (nextInput) nextInput.focus();
        }
      }
    });

    del.addEventListener('click', function(){ removeQuickCaptureRow(id); });

    if (focus){
      setTimeout(function(){ input.focus(); }, 30);
    }
  }

  function removeQuickCaptureRow(id){
    qcRows = qcRows.filter(function(r){ return r.id !== id; });
    var row = document.querySelector('.qc-row[data-id="' + id + '"]');
    if (row) row.remove();
    if (!qcRows.length) addQuickCaptureRow(true);
  }

  function toggleQcCategoryPopover(chipEl, rowId){
    var existing = document.querySelector('.qc-type-popover');
    if (existing){
      var wasForThisRow = existing.dataset.forRow === rowId;
      existing.remove();
      if (wasForThisRow) return;
    }
    var pop = document.createElement('div');
    pop.className = 'qc-type-popover';
    pop.dataset.forRow = rowId;
    pop.innerHTML = QUICK_CAPTURE_CATEGORIES.map(function(c){
      return '<button type="button" class="qc-type-option" data-key="' + c.key + '"><span class="chip-dot" style="--chip-color:' + c.color + '"></span>' + c.label + '</button>';
    }).join('');
    document.body.appendChild(pop);

    var rect = chipEl.getBoundingClientRect();
    var popHeight = pop.offsetHeight;
    var spaceBelow = window.innerHeight - rect.bottom;
    var top = (popHeight + 10 <= spaceBelow) ? (rect.bottom + 6) : Math.max(8, rect.top - popHeight - 6);
    pop.style.top = top + 'px';
    pop.style.left = rect.left + 'px';
    pop.style.maxHeight = Math.min(popHeight, window.innerHeight - 16) + 'px';

    pop.querySelectorAll('.qc-type-option').forEach(function(opt){
      opt.addEventListener('click', function(e){
        e.stopPropagation();
        setQcRowCategory(rowId, opt.dataset.key);
        pop.remove();
      });
    });
  }

  function setQcRowCategory(rowId, key){
    var r = qcRows.find(function(r){ return r.id === rowId; });
    if (!r) return;
    r.category = key;
    qcLastCategory = key;
    var chip = document.querySelector('.qc-type-chip[data-id="' + rowId + '"]');
    if (chip){
      var cat = QUICK_CAPTURE_CATEGORY_MAP[key];
      chip.innerHTML = '<span class="chip-dot" style="--chip-color:' + cat.color + '"></span>' + cat.label;

  // ---------- review day (past-day resolution, one item at a time) ----------
  function openReviewDaySheet(dateStr){
    editingId = null;
    var d = new Date(dateStr + 'T00:00:00');
    var dayLabel = d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

    function buildHtml(){
      var unresolved = commitments.filter(function(c){ return c.date === dateStr && c.status === 'planned'; });
      if (unresolved.length){

          '<div class="sheet-head"><div class="sheet-title">Review day</div><button class="sheet-close" id="sheetCloseBtn">✕</button></div>' +
          '<div style="font-size:12.5px;color:var(--text-muted);margin-bottom:14px">' + dayLabel + ' · ' + unresolved.length + ' item' + (unresolved.length===1?'':'s') + ' left</div>' +
          '<div style="font-size:15px;font-weight:700;margin-bottom:12px">' + c.title + '</div>' +
          '<div class="status-btn-grid" id="reviewStatusGrid">' +
            ['completed','partial','disrupted','not_done'].map(function(s){
              return '<button type="button" class="status-btn" data-s="' + s + '">' + COMMITMENT_STATUS_LABEL[s] + '</button>';
            }).join('') +
          '</div>';
      }
      var hasDayStatus = dayStatuses.some(function(ds){ return ds.date === dateStr; });
      if (!hasDayStatus){
        return '<div class="sheet-handle"></div>' +
          '<div class="sheet-head"><div class="sheet-title">Review day</div><button class="sheet-close" id="sheetCloseBtn">✕</button></div>' +
          '<div style="font-size:12.5px;color:var(--text-muted);margin-bottom:14px">' + dayLabel + ' — all actions resolved. How did the day go overall? Missing data isn\'t the same as failure.</div>' +
          '<div class="status-btn-grid" id="reviewDayStatusGrid">' +
            ['completed','partial','disrupted','unknown'].map(function(s){
              return '<button type="button" class="status-btn" data-s="' + s + '">' + DAY_STATUS_LABEL[s] + '</button>';
            }).join('') +
          '</div>';
      }
      return '<div class="sheet-handle"></div>' +
        '<div class="sheet-head"><div class="sheet-title">Review day</div><button class="sheet-close" id="sheetCloseBtn">✕</button></div>' +
        '<div class="empty-state">' + dayLabel + ' is fully reviewed.</div>';
    }

    function render(){
      sheetEl.innerHTML = buildHtml();
      backdrop.classList.add('open');
      document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);
      var itemGrid = document.getElementById('reviewStatusGrid');
      if (itemGrid){
        var unresolved = commitments.filter(function(c){ return c.date === dateStr && c.status === 'planned'; });
        var c = unresolved[0];
        itemGrid.querySelectorAll('.status-btn').forEach(function(btn){
          btn.addEventListener('click', function(){
            saveCommitment(Object.assign({}, c, { status: btn.dataset.s, disruptionReason: btn.dataset.s === 'disrupted' ? c.disruptionReason : null }));
            render();
          });
        });

      var dayGrid = document.getElementById('reviewDayStatusGrid');
      if (dayGrid){
        dayGrid.querySelectorAll('.status-btn').forEach(function(btn){
          btn.addEventListener('click', function(){
            saveDayStatus(dateStr, btn.dataset.s);
            render();
          });
        });
      }
    }

    render();
  }

  // ---------- accountability message (deterministic, no AI) ----------
  function renderAccountabilityMessage(){
    var wrap = document.getElementById('accountabilityMsg');
    if (!wrap) return;
    var dateStr = viewedDate;
    var isToday = dateStr === todayStr();
    var when = isToday ? 'today' : 'that day';
    // Roadblocks are risks, not tasks — leave them out of the completion count
    // (they already have their own group above).
    var dayCommitments = commitments.filter(function(c){ return c.date === dateStr && c.category !== 'roadblock'; });
    var msgs = [];

    if (dayCommitments.length){
      var completedCount = dayCommitments.filter(function(c){ return c.status === 'completed'; }).length;
      msgs.push(completedCount + ' of ' + dayCommitments.length + ' action' + (dayCommitments.length===1?'':'s') + ' complete.');
      var stillPlanned = dayCommitments.filter(function(c){ return c.status === 'planned'; });
      if (stillPlanned.length && stillPlanned.length <= 2){
        stillPlanned.forEach(function(c){ msgs.push('"' + c.title + '" is still outstanding.'); });
      }
    }

    var plan = getPlanForDate(dateStr);
    if (plan && !plan.restDay && plan.trainingTypes && plan.trainingTypes.length){
      var loggedTypesThatDay = sessions.filter(function(s){ return s.date === dateStr; }).map(function(s){ return s.type; });
      plan.trainingTypes.forEach(function(t){
        if (loggedTypesThatDay.indexOf(t) === -1){
          msgs.push(TYPE_LABEL[t] + ' was planned but hasn\'t been logged' + (isToday ? '' : ' for ' + when) + '.');
        }
      });
    }

    if (!msgs.length){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = '<div class="accountability-box">' + msgs.map(function(m){ return '<div>' + m + '</div>'; }).join('') + '</div>';
  }

  // ---------- catch-up flow (missing data \u2260 failure) ----------
  function computeCatchUpDates(){
    var results = [];
    for (var i=1; i<=7; i++){
      var d = new Date(); d.setDate(d.getDate() - i);
      var dateStr = fmtDate(d);
      var hasPlan = !!getPlanForDate(dateStr);
      var hasCommitments = commitments.some(function(c){ return c.date === dateStr; });
      var alreadyResolved = dayStatuses.some(function(ds){ return ds.date === dateStr; });
      if ((hasPlan || hasCommitments) && !alreadyResolved){
        results.push(dateStr);
      }
    }
    return results.sort();
  }

  function renderCatchUpBanner(){
    var wrap = document.getElementById('catchUpBanner');
    if (!wrap) return;
    var pending = computeCatchUpDates();
    if (!pending.length){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = '<div class="catchup-banner" id="catchUpBannerBtn">' +
      pending.length + ' day' + (pending.length===1?'':'s') + ' need' + (pending.length===1?'s':'') + ' a quick catch-up →</div>';
    document.getElementById('catchUpBannerBtn').addEventListener('click', openCatchUpSheet);
  }

  function openCatchUpSheet(){

    function buildHtml(){
      var pending = computeCatchUpDates();
      if (!pending.length){
        return '<div class="sheet-handle"></div>' +
          '<div class="sheet-head"><div class="sheet-title">Catch-up</div><button class="sheet-close" id="sheetCloseBtn">✕</button></div>' +
          '<div class="empty-state">All caught up</div>';
      }
      var rows = pending.map(function(dateStr){
        var d = new Date(dateStr + 'T00:00:00');
        var label = d.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});
        return '<div class="catchup-day-row"><div class="catchup-day-label">' + label + '</div>' +
          '<div class="catchup-status-row">' +
            ['completed','partial','disrupted','unknown'].map(function(s){
              return '<button type="button" class="catchup-status-btn" data-date="' + dateStr + '" data-status="' + s + '">' + DAY_STATUS_LABEL[s] + '</button>';
            }).join('') +
          '</div></div>';
      }).join('');
      return '<div class="sheet-handle"></div>' +
        '<div class="sheet-head"><div class="sheet-title">Catch-up</div><button class="sheet-close" id="sheetCloseBtn">✕</button></div>' +

    function wireSheet(){

  // ---------- calendar view ----------
  var CAL_TYPE_ORDER = ['padel','resistance','cardio','yoga','weight','nutrition','photo'];

  function renderCalendar(){
    var label = calMonth.toLocaleDateString(undefined, { month:'long', year:'numeric' });
    document.getElementById('calMonthLabel').textContent = label;
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['S','M','T','W','T','F','S'].forEach(function(d){
      var el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    var year = calMonth.getFullYear(), month = calMonth.getMonth();
    var firstDow = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var today = todayStr();
    var isCurrentMonth = (year === new Date().getFullYear() && month === new Date().getMonth());
    var activeDayCount = 0;
    var trainingDayCount = 0; // excludes passive log-only days like photo/nutrition-only

    for (var i=0; i<firstDow; i++){
      var pad = document.createElement('div');
      pad.className = 'cal-cell empty';
      grid.appendChild(pad);
    }
    for (var day=1; day<=daysInMonth; day++){
      var dateObj = new Date(year, month, day);
      var dateStr = fmtDate(dateObj);
      var cell = document.createElement('div');
      cell.className = 'cal-cell';
      var dayStatus = dayStatuses.find(function(ds){ return ds.date === dateStr; });
      if (dateStr === today) cell.classList.add('today');
      else if (dateStr === selectedDay) cell.classList.add('selected');
      else if (dayStatus && dayStatus.status !== 'unknown') cell.classList.add('status-' + dayStatus.status);

      var daySessions = sessions.filter(function(s){ return s.date === dateStr; });
      var typesPresent = [];
      daySessions.forEach(function(s){ if (typesPresent.indexOf(s.type) === -1) typesPresent.push(s.type); });
      var hasActions = commitments.some(function(c){ return c.date === dateStr; });

      if (typesPresent.length && (!isCurrentMonth || dateObj <= new Date())){
        activeDayCount++;
        var trainingTypes = typesPresent.filter(function(t){ return t !== 'photo' && t !== 'nutrition'; });
        if (trainingTypes.length) trainingDayCount++;
      }

      if (typesPresent.length){
        var dominant = CAL_TYPE_ORDER.find(function(t){ return typesPresent.indexOf(t) !== -1; }) || typesPresent[0];
        var color = getComputedStyle(document.documentElement).getPropertyValue('--' + dominant).trim();
        cell.style.background = hexToRgba(color, 0.22);
      }

      var dotsHtml = typesPresent.slice(0,4).map(function(t){ return '<span class="dot ' + t + '"></span>'; }).join('');
      cell.innerHTML = '<span>' + day + '</span>' + (dotsHtml ? '<span class="cal-dots">' + dotsHtml + '</span>' : '') +
        (hasActions ? '<span class="cal-action-mark"></span>' : '');
      cell.addEventListener('click', function(ds){
        return function(){ selectedDay = ds; renderCalendar(); };
      }(dateStr));
      grid.appendChild(cell);
    }

    renderCalSummary(daysInMonth, activeDayCount, trainingDayCount, isCurrentMonth);
    renderDayDetail();
  }

  function hexToRgba(hex, alpha){
    hex = hex.replace('#','');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
    var r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function renderCalSummary(daysInMonth, activeDayCount, trainingDayCount, isCurrentMonth){

      '<div class="stat-num"><div class="val display">' + pct + '%</div><div class="lbl">Consistency</div></div>';
  }

      if (plan.restDay) planWrap.innerHTML += '<span class="plan-chip outline">Rest day</span>';

  document.getElementById('calNext').addEventListener('click', function(){
    calMonth.setMonth(calMonth.getMonth()+1); renderCalendar();
