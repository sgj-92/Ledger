<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#14171a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ledger — Training Log</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171a;
    --panel: #1b1f23;
    --panel-raised: #21262b;
    --border: #2a2f34;
    --text: #edeae3;
    --text-muted: #8b9198;
    --text-faint: #5a6067;
    --amber: #e8a33d;
    --padel: #e4572e;
    --resistance: #c9a66b;
    --cardio: #4fa8a0;
    --yoga: #9b8aa3;
    --weight: #7c93a8;
    --photo: #c97b84;
    --nutrition: #8fae5d;
    --day-good: #6fae5a;
    --day-neutral: #d9b23c;
    --day-bad: #8b9198;
    --danger: #d9534f;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-card: 0 1px 1px rgba(0,0,0,0.2), 0 10px 22px -14px rgba(0,0,0,0.65);
    --shadow-raised: 0 2px 3px rgba(0,0,0,0.25), 0 16px 32px -16px rgba(0,0,0,0.7);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  html, body { height: 100%; }
  body {
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .display {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  header.top {
    padding: calc(20px + env(safe-area-inset-top)) 20px 18px;
    position: sticky;
    top: 0;
    background: linear-gradient(var(--bg) 78%, transparent);
    z-index: 5;
  }
  .top-date-label { font-size: 13px; color: var(--text-muted); margin: 0 0 2px; font-weight: 500; }
  .top-date { font-size: 40px; line-height: 1; margin: 0; }
  main { padding: 0 20px 24px; flex: 1 0 auto; }
  section.view { display: none; animation: fadein 0.18s ease; }
  section.view.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

  h2.section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin: 28px 0 12px;
  }
  h2.section-title:first-child { margin-top: 4px; }

  .quicklog-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .quicklog-card {
    border: none;
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: left;
    cursor: pointer;
    color: #14171a;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 26px;
    min-height: 100px;
    transition: transform 0.15s cubic-bezier(.2,.8,.3,1), box-shadow 0.15s ease;
    font-family: inherit;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
  }
  .quicklog-card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 45%);
    pointer-events: none;
  }
  .quicklog-card:active { transform: scale(0.96); box-shadow: var(--shadow-sm, 0 1px 1px rgba(0,0,0,0.2)); }
  .quicklog-card .ql-icon { width: 24px; height: 24px; position: relative; z-index: 1; }
  .quicklog-card .ql-icon svg { width: 100%; height: 100%; display: block; }
  .quicklog-card .ql-label { font-size: 15.5px; font-weight: 700; position: relative; z-index: 1; letter-spacing: -0.01em; }
  .quicklog-card.padel { background: var(--padel); color: #2b0e05; }
  .quicklog-card.resistance { background: var(--resistance); color: #2b2210; }
  .quicklog-card.cardio { background: var(--cardio); color: #08211e; }
  .quicklog-card.yoga { background: var(--yoga); color: #241f29; }
  .quicklog-card.weight { background: var(--weight); color: #0d1a24; }
  .quicklog-card.photo { background: var(--photo); color: #2a1013; }
  .quicklog-card.nutrition { background: var(--nutrition); color: #131f0a; }
  .quicklog-card.span-2 {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    min-height: auto;
    padding: 18px 16px;
  }
  .quicklog-card.span-2 .ql-label { font-size: 16px; }

  .custom-log-btn {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .custom-log-btn:active { background: var(--panel); }

  .session-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    background: var(--panel);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .session-item:active { transform: scale(0.985); background: var(--panel-raised); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.padel { background: var(--padel); }
  .dot.resistance { background: var(--resistance); }
  .dot.cardio { background: var(--cardio); }
  .dot.yoga { background: var(--yoga); }
  .dot.weight { background: var(--weight); }
  .dot.photo { background: var(--photo); }
  .dot.nutrition { background: var(--nutrition); }
  .session-item .si-main { flex: 1; min-width: 0; }
  .session-item .si-type { font-size: 13px; font-weight: 600; text-transform: capitalize; }
  .session-item .si-detail { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .si-time { font-size: 12px; color: var(--text-faint); flex-shrink: 0; }

  .empty-state {
    padding: 30px 16px;
    text-align: center;
    color: var(--text-faint);
    font-size: 13.5px;
    border: 1px dashed var(--border);
    border-radius: var(--radius-md);
  }

  /* Calendar */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
  }
  .cal-month-label { font-size: 17px; font-weight: 600; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-dow { text-align: center; font-size: 11px; color: var(--text-faint); padding-bottom: 6px; }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 13px;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid transparent;
    color: var(--text-muted);
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .cal-cell:active { transform: scale(0.92); }
  .cal-cell.empty { background: transparent; cursor: default; }
  .cal-cell.empty:active { transform: none; }
  .cal-cell.today { border-color: var(--amber); color: var(--amber); font-weight: 700; box-shadow: 0 0 0 1px var(--amber) inset; }
  .cal-cell.selected { background: var(--panel-raised); border-color: var(--text-faint); }
  .cal-cell .cal-dots { display: flex; gap: 2px; height: 6px; }
  .cal-cell .cal-dots .dot { width: 5px; height: 5px; }
  .cal-day-detail { margin-top: 20px; }

  /* Stats */
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-card);
  }
  .stat-card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .stat-card-head .dot { width: 10px; height: 10px; }
  .stat-card-head .name { font-size: 14px; font-weight: 600; text-transform: capitalize; }
  .stat-card-clickable { cursor: pointer; transition: transform 0.1s ease, background 0.1s ease; }
  .stat-card-clickable:active { transform: scale(0.98); background: var(--panel-raised); }
  .stat-card-chevron { margin-left: auto; color: var(--text-faint); font-size: 18px; }
  .stat-row { display: flex; gap: 18px; }
  .stat-num { flex: 1; }
  .stat-num .val { font-size: 30px; line-height: 1; }
  .stat-num .lbl { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

  .weekbar { margin-bottom: 22px; }
  .weekbar-bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; margin-top: 10px; }
  .weekbar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .weekbar-stack { width: 100%; max-width: 26px; display: flex; flex-direction: column-reverse; border-radius: 4px; overflow: hidden; }
  .weekbar-seg { width: 100%; height: 14px; }
  .weekbar-day { font-size: 10.5px; color: var(--text-faint); }

  /* Tab bar */
  nav.tabbar {
    position: sticky;
    bottom: 0;
    background: rgba(20, 23, 26, 0.86);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    z-index: 20;
    flex-shrink: 0;
  }
  nav.tabbar button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 0 4px;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  nav.tabbar button .tab-icon { width: 23px; height: 23px; transition: transform 0.15s cubic-bezier(.34,1.56,.64,1); }
  nav.tabbar button .tab-icon svg { width: 100%; height: 100%; display: block; }
  nav.tabbar button.active { color: var(--amber); }
  nav.tabbar button.active .tab-icon { transform: translateY(-1px) scale(1.04); }
  nav.tabbar button:active .tab-icon { transform: scale(0.9); }

  /* Sheet / modal */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 30;
    display: none;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    background: var(--panel);
    width: 100%;
    max-width: 560px;
    border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    box-shadow: var(--shadow-raised);
    animation: sheet-up 0.22s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes sheet-up {
    from { transform: translateY(24px); opacity: 0.4; }
    to { transform: translateY(0); opacity: 1; }
  }
  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sheet-title { font-size: 18px; font-weight: 700; text-transform: capitalize; }
  .sheet-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 11px 12px;
    font-family: inherit;
    font-size: 14.5px;
    transition: border-color 0.12s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--amber);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .seg-toggle { display: flex; gap: 8px; }
  .seg-toggle button {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--panel-raised);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .seg-toggle button.sel { border-color: var(--amber); color: var(--amber); background: rgba(232,163,61,0.1); }

  #dayRatingToggle button[data-v="good"].sel { border-color: var(--day-good); color: var(--day-good); background: rgba(111,174,90,0.14); }
  #dayRatingToggle button[data-v="neutral"].sel { border-color: var(--day-neutral); color: var(--day-neutral); background: rgba(217,178,60,0.14); }
  #dayRatingToggle button[data-v="off-track"].sel { border-color: var(--day-bad); color: var(--day-bad); background: rgba(139,145,152,0.14); }

  .exercise-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .exercise-row input { flex: 1; min-width: 0; }
  .exercise-row input.ex-name { flex-basis: 100%; }
  .exercise-row select.ex-unit { flex: 0 0 72px; font-size: 13px; padding: 10px 6px; }
  .exercise-row .ex-rm { background: none; border: none; color: var(--text-faint); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .add-exercise-btn {
    width: 100%; padding: 10px; border-radius: var(--radius-sm);
    border: 1px dashed var(--border); background: none; color: var(--text-muted);
    font-family: inherit; font-size: 13px; cursor: pointer; margin-bottom: 6px;
  }

  .si-thumb { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .photo-preview-wrap { margin-bottom: 14px; }
  .photo-preview-wrap img { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--radius-sm); display: block; }

  .sparkline { display: block; margin-top: 4px; }
  .detail-chart-wrap { margin-bottom: 18px; }
  .detail-chart-wrap svg { width: 100%; height: 120px; display: block; }
  .detail-trend { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  .detail-trend strong { color: var(--text); }

  .player-card {
    background: linear-gradient(135deg, var(--panel-raised), var(--panel));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-raised);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .avatar-ring-wrap { position: relative; width: 74px; height: 74px; flex-shrink: 0; cursor: pointer; transition: transform 0.12s ease; }
  .avatar-ring-wrap:active { transform: scale(0.94); }
  .avatar-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .avatar-ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
  .avatar-ring-fg { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }
  .avatar-figure {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-figure svg { width: 46px; height: 46px; }
  .avatar-level-chip {
    position: absolute; bottom: -2px; right: -2px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--panel);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Big Shoulders Display', sans-serif;
    font-size: 12px; font-weight: 700; color: #14171a;
  }
  .player-info { flex: 1; min-width: 0; }
  .player-rank { font-size: 15px; font-weight: 700; color: var(--text); }
  .player-xp-text { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .xp-bar-track { width: 100%; height: 7px; background: var(--border); border-radius: 100px; margin-top: 8px; overflow: hidden; }
  .xp-bar-fill { height: 100%; border-radius: 100px; transition: width 0.4s ease; }
  .streak-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 600; color: var(--amber);
    margin-top: 8px;
  }

  .focus-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 14px;
    background: var(--panel);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    box-shadow: var(--shadow-card);
  }
  .focus-item.done { opacity: 0.55; }
  .focus-item.done .focus-text { text-decoration: line-through; }
  .focus-tag {
    flex-shrink: 0;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 8px;
    border-radius: 100px;
    color: #14171a;
    white-space: nowrap;
    margin-top: 1px;
  }
  .focus-tag.technique { background: var(--cardio); }
  .focus-tag.footwork { background: var(--amber); }
  .focus-tag.physical { background: var(--resistance); }
  .focus-tag.general { background: var(--weight); }
  .focus-text { font-size: 14px; color: var(--text); flex: 1; }

  .target-weight-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 4px;
    box-shadow: var(--shadow-card);
    cursor: pointer;
  }
  .target-weight-row { display: flex; gap: 18px; }
  .target-weight-row .stat-num .val { font-size: 30px; line-height: 1; }
  .target-weight-row .stat-num .lbl { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

  .checkbox-field { display: flex; align-items: center; background: var(--panel-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
  .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); cursor: pointer; margin-bottom: 0 !important; }
  .checkbox-label input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
  .cb-box {
    width: 20px; height: 20px; flex-shrink: 0;
    border: 1.5px solid var(--text-faint);
    border-radius: 6px;
    background: var(--panel);
    position: relative;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .checkbox-label input:checked + .cb-box { background: var(--amber); border-color: var(--amber); }
  .cb-box::after {
    content: '';
    position: absolute;
    left: 50%; top: 44%;
    width: 5px; height: 9px;
    border: solid #201404;
    border-width: 0 2px 2px 0;
    transform: translate(-50%, -50%) rotate(45deg);
    opacity: 0;
  }
  .checkbox-label input:checked + .cb-box::after { opacity: 1; }

  .save-btn {
    width: 100%;
    padding: 15px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--amber);
    color: #201404;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 8px 20px -8px rgba(232,163,61,0.5);
    transition: transform 0.1s ease;
  }
  .save-btn:active { transform: scale(0.98); opacity: 0.9; }
  .delete-btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--danger);
    background: none;
    color: var(--danger);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.1s ease;
  }
  .delete-btn:active { background: rgba(217,83,79,0.1); }

  .sync-note { font-size: 11px; color: var(--text-faint); text-align: center; margin: 18px 0 4px; }
</style>
</head>
<body>

<header class="top">
  <p class="top-date-label" id="topDateLabel">—</p>
  <h1 class="top-date display" id="topDate">—</h1>
</header>

<main>

  <section class="view active" id="view-log">
    <h2 class="section-title">Quick log</h2>
    <div class="quicklog-grid">
      <button class="quicklog-card nutrition span-2" data-type="nutrition">

<script>
(function(){

  // ---------- state ----------
  var sessions = [];   // {id, type, date, ...fields}
  var dbRef = null;
  var dbReady = false;
  var currentView = 'log';
  var calMonth = new Date(); calMonth.setDate(1);
  var selectedDay = null;
  var editingId = null;

  var TYPE_LABEL = { padel: 'Padel', resistance: 'Resistance training', cardio: 'Cardio', yoga: 'Mobility', weight: 'Weight', photo: 'Daily photo', nutrition: 'Nutrition' };
  var DAY_RATING_LABEL = { good: 'On-track', neutral: 'Neutral', 'off-track': 'Off-track' };
  var DEFAULT_CARDIO_TYPES = ['Running','Cycling','Swimming','Rowing','Walking'];
  var DEFAULT_EXERCISES = [
    {name:'Bench press', unit:'kg'}, {name:'Squat', unit:'kg'}, {name:'Deadlift', unit:'kg'},
    {name:'Overhead press', unit:'kg'}, {name:'Pull-up', unit:'reps'}, {name:'Plank', unit:'sec'}
  ];
  var presets = { cardioTypes: DEFAULT_CARDIO_TYPES.slice(), exercises: DEFAULT_EXERCISES.slice(), targetWeightKg: null };
  var focusItems = [];
  var FOCUS_CATEGORY_LABEL = { technique: 'Technique', footwork: 'Footwork', physical: 'Physical', general: 'General' };

  function normalizeSession(s){
    // legacy: sessions logged before the Cardio rename used type 'running'
    if (s.type === 'running'){
      s.type = 'cardio';
      if (!s.cardioType) s.cardioType = 'Running';
    }
    // legacy: sessions logged before the Resistance training rename used type 'gym'
    if (s.type === 'gym'){
      s.type = 'resistance';
    }
    return s;
  }

  function todayStr(){ return fmtDate(new Date()); }
  function fmtDate(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+da;
  }
  function niceDate(d){
    return d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
  }
  function niceTime(iso){
    try { return new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); } catch(e){ return ''; }
  }
  function uid(){ return 'l' + Math.random().toString(36).slice(2,10); }

  // ---------- persistence (Firebase Firestore) ----------
  // Fill in your project's config here — Firebase console → Project settings →
  // "Your apps" → the </> web icon → copy the firebaseConfig object.
  var firebaseConfig = {
    apiKey: "AIzaSyA1W9UcEkQ67cy1oY6PfPqaylDXhUxGqb8",
    authDomain: "ledger-6aec3.firebaseapp.com",
    projectId: "ledger-6aec3",
    storageBucket: "ledger-6aec3.firebasestorage.app",
    messagingSenderId: "607695857530",
    appId: "1:607695857530:web:5cd564760be8a755de58c3"
  };

  function localSave(){
    try { localStorage.setItem('ledger_sessions_fallback', JSON.stringify(sessions)); } catch(e){}
  }
  function localLoad(){
    try {
      var raw = localStorage.getItem('ledger_sessions_fallback');
      if (raw) sessions = JSON.parse(raw).map(normalizeSession);
    } catch(e){}
  }
  function localSavePresets(){
    try { localStorage.setItem('ledger_presets_fallback', JSON.stringify(presets)); } catch(e){}
  }
  function localLoadPresets(){
    try {
      var raw = localStorage.getItem('ledger_presets_fallback');
      if (raw) presets = JSON.parse(raw);
    } catch(e){}
  }
  function localSaveFocus(){
    try { localStorage.setItem('ledger_focus_fallback', JSON.stringify(focusItems)); } catch(e){}
  }
  function localLoadFocus(){
    try {
      var raw = localStorage.getItem('ledger_focus_fallback');
      if (raw) focusItems = JSON.parse(raw);
    } catch(e){}
  }

  async function initDb(){
    try {
      if (firebaseConfig.apiKey === "YOUR_API_KEY") { fallbackMode(); return; }
      firebase.initializeApp(firebaseConfig);
      dbRef = firebase.firestore();
      dbReady = true;
      document.getElementById('syncNote').textContent = '';
      dbRef.collection('ledger_sessions').orderBy('date','desc')
        .onSnapshot(function(snap){
          sessions = snap.docs.map(function(d){ var data = d.data() || {}; data.id = d.id; return normalizeSession(data); });
          renderAll();
        }, function(err){
          console.error('firestore snapshot error', err);
          fallbackMode();
        });
      dbRef.collection('ledger_meta').doc('presets').onSnapshot(function(doc){
        if (doc.exists){
          var data = doc.data();
          presets.cardioTypes = data.cardioTypes || DEFAULT_CARDIO_TYPES.slice();
          presets.exercises = data.exercises || DEFAULT_EXERCISES.slice();
          presets.targetWeightKg = data.targetWeightKg != null ? data.targetWeightKg : null;
          if (currentView === 'focus') renderFocus();
        } else {
          dbRef.collection('ledger_meta').doc('presets').set(presets).catch(function(){});
        }
      }, function(err){ console.error('presets snapshot error', err); });
      dbRef.collection('ledger_focus').orderBy('createdAt','desc')
        .onSnapshot(function(snap){
          focusItems = snap.docs.map(function(d){ var data = d.data() || {}; data.id = d.id; return data; });
          if (currentView === 'focus') renderFocus();
        }, function(err){ console.error('focus snapshot error', err); });
    } catch(e){
      console.error(e);
      fallbackMode();
    }
  }

  function fallbackMode(){
    dbReady = false;
    localLoad();
    localLoadPresets();
    localLoadFocus();
    document.getElementById('syncNote').textContent = 'Saving on this device only — add your Firebase config to sync';
    renderAll();
  }

  async function savePresets(){
    if (dbReady && dbRef){
      try { await dbRef.collection('ledger_meta').doc('presets').set(presets); return; }
      catch(e){ console.error('presets save failed', e); }
    }
    localSavePresets();
  }

  async function saveFocusItem(item){
    if (dbReady && dbRef){
      try {
        if (item.id){
          var id = item.id; var copy = Object.assign({}, item); delete copy.id;
          await dbRef.collection('ledger_focus').doc(id).set(copy);
        } else {
          await dbRef.collection('ledger_focus').add(item);
        }
        return;
      } catch(e){ console.error('focus save failed', e); }
    }
    if (item.id){
      var idx = focusItems.findIndex(function(f){ return f.id === item.id; });
      if (idx > -1) focusItems[idx] = item;
    } else {
      item.id = uid();
      focusItems.unshift(item);
    }
    localSaveFocus();
    renderFocus();
  }

  async function deleteFocusItem(id){
    if (dbReady && dbRef){
      try { await dbRef.collection('ledger_focus').doc(id).delete(); return; }
      catch(e){ console.error(e); }
    }
    focusItems = focusItems.filter(function(f){ return f.id !== id; });
    localSaveFocus();
    renderFocus();
  }

  async function saveSession(data){
    if (dbReady && dbRef){
      try {
        if (data.id){
          var id = data.id; var copy = Object.assign({}, data); delete copy.id;
          await dbRef.collection('ledger_sessions').doc(id).set(copy);
        } else {
          await dbRef.collection('ledger_sessions').add(data);
        }
        return;
      } catch(e){ console.error('save failed, falling back', e); }
    }
    // local fallback
    if (data.id){
      var idx = sessions.findIndex(function(s){ return s.id === data.id; });
      if (idx > -1) sessions[idx] = data;
    } else {
      data.id = uid();
      sessions.unshift(data);
    }
    localSave();
    renderAll();
  }

  async function deleteSession(id){
    if (dbReady && dbRef){
      try { await dbRef.collection('ledger_sessions').doc(id).delete(); return; }
      catch(e){ console.error(e); }
    }
    sessions = sessions.filter(function(s){ return s.id !== id; });
    localSave();
    renderAll();
  }

  // ---------- tab switching ----------
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentView = btn.dataset.view;
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      document.getElementById('view-' + currentView).classList.add('active');
      if (currentView === 'calendar') renderCalendar();
      if (currentView === 'stats') renderStats();
      if (currentView === 'focus') renderFocus();
    });
  });

  // ---------- header ----------
  function renderHeader(){
    var now = new Date();
    document.getElementById('topDateLabel').textContent = now.toLocaleDateString(undefined,{ weekday:'long' });
    document.getElementById('topDate').textContent = now.toLocaleDateString(undefined,{ day:'numeric', month:'long' });
  }

  // ---------- log view ----------
  function sessionDetailText(s){
    if (s.type === 'padel'){
      var parts = [];
      if (s.padelType && s.padelType !== 'match') parts.push(s.padelType.charAt(0).toUpperCase() + s.padelType.slice(1));
      if (s.padelType === 'match' || !s.padelType){
        if (s.result) parts.push(s.result === 'win' ? 'Won' : s.result === 'loss' ? 'Lost' : 'Played');
        if (s.sets && s.sets.length){
          parts.push(s.sets.map(function(st){ return st.yourGames + '-' + st.oppGames; }).join(', '));
        } else if (s.gamesWon != null && s.gamesLost != null) {
          parts.push(s.gamesWon + '–' + s.gamesLost);
        }
      }
      if (s.players && s.players.filter(Boolean).length){
        parts.push('w/ ' + s.players.filter(Boolean).join(', '));
      } else if (s.opponent) {
        parts.push('vs ' + s.opponent);
      }
      if (s.venue) parts.push('@ ' + s.venue);
      return parts.join(' · ') || 'Session logged';
    }
    if (s.type === 'resistance'){
      var n = (s.exercises||[]).length;
      return n ? n + ' exercise' + (n===1?'':'s') + (s.bodyweight ? ' · ' + s.bodyweight + 'kg' : '') : 'Session logged';
    }
    if (s.type === 'cardio'){
      var bits = [];
      if (s.cardioType) bits.push(s.cardioType);
      if (s.distance) bits.push(s.distance + ' ' + (s.distanceUnit || 'km'));
      if (s.durationMin) bits.push(s.durationMin + ' min');
      return bits.join(' · ') || 'Session logged';
    }
    if (s.type === 'yoga'){
      var b2 = [];
      if (s.focus) b2.push(s.focus);
      if (s.durationMin) b2.push(s.durationMin + ' min');
      return b2.join(' · ') || 'Session logged';
    }
    if (s.type === 'weight'){
      return s.weightKg ? s.weightKg + ' kg' : 'Weight logged';
    }
    if (s.type === 'photo'){
      return s.notes || 'Photo added';
    }
    if (s.type === 'nutrition'){
      var nb = [];
      if (s.dayRating) nb.push(DAY_RATING_LABEL[s.dayRating] + ' day');
      if (s.calories) nb.push(s.calories + ' kcal');
      if (s.glutenFree) nb.push('GF');
      if (s.minimalProcessed) nb.push('Minimal processed');
      if (s.sufficientWater) nb.push('Hydrated' + (s.waterAmount ? ' (' + s.waterAmount + ')' : ''));
      return nb.join(' · ') || 'Day logged';
    }
    return s.notes || '';
  }

  function renderSessionItem(s){
    var div = document.createElement('div');
    div.className = 'session-item';
    var leadHtml = (s.type === 'photo' && s.photoDataUrl)
      ? '<img class="si-thumb" src="' + s.photoDataUrl + '">'
      : '<span class="dot ' + s.type + '"></span>';
    div.innerHTML =
      leadHtml +
      '<div class="si-main">' +
        '<div class="si-type">' + TYPE_LABEL[s.type] + '</div>' +
        '<div class="si-detail">' + sessionDetailText(s) + '</div>' +
      '</div>' +
      '<div class="si-time">' + (s.createdAt ? niceTime(s.createdAt) : '') + '</div>';
    div.addEventListener('click', function(){ openSheet(s.type, s); });
    return div;
  }

  function renderLogView(){
    var today = todayStr();
    var todayList = document.getElementById('todayList');
    var recentList = document.getElementById('recentList');
    todayList.innerHTML = '';
    recentList.innerHTML = '';

    var todaysSessions = sessions.filter(function(s){ return s.date === today; });
    if (!todaysSessions.length){
      var e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = 'Nothing logged yet today — tap a card above to start';
      todayList.appendChild(e);
    } else {
      todaysSessions.forEach(function(s){ todayList.appendChild(renderSessionItem(s)); });
    }

    var recent = sessions.filter(function(s){ return s.date !== today; }).slice(0, 8);
    if (!recent.length){
      var e2 = document.createElement('div');
      e2.className = 'empty-state';
      e2.textContent = 'Your recent sessions will show up here';
      recentList.appendChild(e2);
    } else {
      recent.forEach(function(s){ recentList.appendChild(renderSessionItem(s)); });
    }
  }

  document.querySelectorAll('.quicklog-card').forEach(function(card){
    card.addEventListener('click', function(){ openSheet(card.dataset.type, null); });
  });

  // ---------- calendar view ----------
  function renderCalendar(){
    var label = calMonth.toLocaleDateString(undefined, { month:'long', year:'numeric' });
    document.getElementById('calMonthLabel').textContent = label;
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['S','M','T','W','T','F','S'].forEach(function(d){
      var el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    var year = calMonth.getFullYear(), month = calMonth.getMonth();
    var firstDow = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var today = todayStr();

    for (var i=0; i<firstDow; i++){
      var pad = document.createElement('div');
      pad.className = 'cal-cell empty';
      grid.appendChild(pad);
    }
    for (var day=1; day<=daysInMonth; day++){
      var dateObj = new Date(year, month, day);
      var dateStr = fmtDate(dateObj);
      var cell = document.createElement('div');
      cell.className = 'cal-cell';
      if (dateStr === today) cell.classList.add('today');
      if (dateStr === selectedDay) cell.classList.add('selected');

      var daySessions = sessions.filter(function(s){ return s.date === dateStr; });
      var typesPresent = [];
      daySessions.forEach(function(s){ if (typesPresent.indexOf(s.type) === -1) typesPresent.push(s.type); });

      var dotsHtml = typesPresent.slice(0,4).map(function(t){ return '<span class="dot ' + t + '"></span>'; }).join('');
      cell.innerHTML = '<span>' + day + '</span>' + (dotsHtml ? '<span class="cal-dots">' + dotsHtml + '</span>' : '');
      cell.addEventListener('click', function(ds){
        return function(){ selectedDay = ds; renderCalendar(); };
      }(dateStr));
      grid.appendChild(cell);
    }

    renderDayDetail();
  }

  function renderDayDetail(){
    var wrap = document.getElementById('calDayDetail');
    wrap.innerHTML = '';
    if (!selectedDay) return;
    var d = new Date(selectedDay + 'T00:00:00');
    var head = document.createElement('h2');
    head.className = 'section-title';
    head.style.marginTop = '0';
    head.textContent = niceDate(d);
    wrap.appendChild(head);

    var daySessions = sessions.filter(function(s){ return s.date === selectedDay; });
    if (!daySessions.length){
      var e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = 'No sessions logged this day';
      wrap.appendChild(e);
    } else {
      daySessions.forEach(function(s){ wrap.appendChild(renderSessionItem(s)); });
    }

    var addBtn = document.createElement('button');
    addBtn.className = 'custom-log-btn';
    addBtn.textContent = 'Log a session for this day';
    addBtn.addEventListener('click', function(){ openSheet('padel', null, selectedDay); });
    wrap.appendChild(addBtn);
  }

  document.getElementById('calPrev').addEventListener('click', function(){
    calMonth.setMonth(calMonth.getMonth()-1); renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', function(){
    calMonth.setMonth(calMonth.getMonth()+1); renderCalendar();
  });

  // ---------- stats view ----------
  function withinDays(s, n){
    var d = new Date(s.date + 'T00:00:00');
    var cutoff = new Date(); cutoff.setDate(cutoff.getDate() - n); cutoff.setHours(0,0,0,0);
    return d >= cutoff;
  }
  function withinThisMonth(s){
    var d = new Date(s.date + 'T00:00:00');
    var now = new Date();
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }

  function renderStats(){
    renderWeekBar();
    var container = document.getElementById('statsCards');
    container.innerHTML = '';

    // Padel
    var padel = sessions.filter(function(s){ return s.type==='padel'; });
    var padelMonth = padel.filter(withinThisMonth);
    var matchesMonth = padelMonth.filter(function(s){ return !s.padelType || s.padelType==='match'; });
    var wins = matchesMonth.filter(function(s){ return s.result==='win'; }).length;

    // Weight (merges dedicated weight logs + bodyweight noted in gym sessions)
    var weightEntries = sessions
      .filter(function(s){ return (s.type==='weight' && s.weightKg) || (s.type==='resistance' && s.bodyweight); })

    var latestWeight = weightEntries.length ? weightEntries[weightEntries.length-1].val : null;

  function sparklineSvg(values, color){
    if (!values.length) return '';
    var w = 200, h = 36, pad = 3;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var range = (max - min) || 1;
    var step = values.length > 1 ? (w - pad*2) / (values.length - 1) : 0;
    var points = values.map(function(v, i){
      var x = pad + i*step;
      var y = h - pad - ((v - min) / range) * (h - pad*2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg class="sparkline" viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="36" preserveAspectRatio="none">' +
      '<polyline points="' + points + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }

  function renderWeeklyBarChart(entries, color){
    // entries: array of {date} — buckets into the last 8 calendar weeks (Sun-Sat)
    var now = new Date();
    var weekStart = new Date(now); weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    var buckets = [];
    for (var i=7; i>=0; i--){
      var start = new Date(weekStart); start.setDate(start.getDate() - i*7);
      var end = new Date(start); end.setDate(end.getDate() + 7);
      buckets.push({ start: start, end: end, count: 0 });
    }
    entries.forEach(function(e){
      var d = new Date(e.date + 'T00:00:00');
      buckets.forEach(function(b){ if (d >= b.start && d < b.end) b.count++; });
    });
    var maxCount = Math.max.apply(null, buckets.map(function(b){ return b.count; }).concat([1]));

    var wrap = document.createElement('div');
    wrap.className = 'weekbar';
    var bars = document.createElement('div');
    bars.className = 'weekbar-bars';
    bars.style.height = '110px';
    buckets.forEach(function(b){
      var col = document.createElement('div');
      col.className = 'weekbar-col';
      var stack = document.createElement('div');
      stack.className = 'weekbar-stack';
      var h = (b.count / maxCount) * 90;
      stack.style.height = Math.max(h, b.count ? 10 : 0) + 'px';
      if (b.count){
        var seg = document.createElement('div');
        seg.style.width = '100%';
        seg.style.height = '100%';
        seg.style.borderRadius = '4px';
        seg.style.background = color;
        stack.appendChild(seg);
      }
      col.appendChild(stack);
      var lbl = document.createElement('div');
      lbl.className = 'weekbar-day';
      lbl.textContent = b.start.toLocaleDateString(undefined,{day:'numeric',month:'short'});
      col.appendChild(lbl);
      bars.appendChild(col);
    });
    wrap.appendChild(bars);
    return wrap;
  }

  function bigLineChartSvg(values, color){
    if (!values.length) return document.createElement('div');
    var w = 320, h = 120, pad = 10;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var range = (max - min) || 1;
    var step = values.length > 1 ? (w - pad*2) / (values.length - 1) : 0;
    var points = values.map(function(v, i){
      var x = pad + i*step;
      var y = h - pad - ((v - min) / range) * (h - pad*2);
      return { x: x, y: y };
    });
    var polyStr = points.map(function(p){ return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var dotsStr = points.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="'+color+'"/>'; }).join('');
    var wrap = document.createElement('div');
    wrap.className = 'detail-chart-wrap';
    wrap.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polyline points="' + polyStr + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      dotsStr +
      '</svg>';
    return wrap;
  }

  // ---------- gamification (player card) ----------
  var LEVEL_TIERS = [
    { min: 1,  max: 2,  color: '#8b9198', name: 'Rookie' },
    { min: 3,  max: 5,  color: '#c9a66b', name: 'Grinder' },
    { min: 6,  max: 9,  color: '#e8a33d', name: 'Contender' },
    { min: 10, max: 14, color: '#4fa8a0', name: 'Competitor' },
    { min: 15, max: 20, color: '#9b8aa3', name: 'Veteran' },
    { min: 21, max: Infinity, color: '#e4572e', name: 'Elite' }
  ];
  function computeXP(){
    var sessionXP = sessions.length * 10;
    var focusXP = focusItems.filter(function(f){ return f.done; }).length * 25;
    return sessionXP + focusXP;
  }

  function computeLevelInfo(xp){
    var level = 1, threshold = 100, remaining = xp;
    while (remaining >= threshold){
      remaining -= threshold;
      level++;
      threshold = level * 100;
    }
    return { level: level, into: remaining, needed: threshold };
  }

  function tierFor(level){
    for (var i=0; i<LEVEL_TIERS.length; i++){
      if (level >= LEVEL_TIERS[i].min && level <= LEVEL_TIERS[i].max) return LEVEL_TIERS[i];
    }
    return LEVEL_TIERS[LEVEL_TIERS.length-1];
  }

    var torsoLegsWide = '<line x1="24" y1="16" x2="24" y2="32"/><line x1="24" y1="32" x2="14" y2="44"/><line x1="24" y1="32" x2="34" y2="44"/>';

        shirt + head +

  function computeStreak(){
    var uniqueDays = {};
    sessions.forEach(function(s){ uniqueDays[s.date] = true; });
    var streak = 0;
    var cursor = new Date();
    // if nothing logged today yet, streak can still count from yesterday backward
    if (!uniqueDays[fmtDate(cursor)]) cursor.setDate(cursor.getDate() - 1);
    while (uniqueDays[fmtDate(cursor)]){
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

    var doneWrap = document.getElementById('focusCompletedWrap');
    activeList.innerHTML = '';
    doneList.innerHTML = '';

    var active = focusItems.filter(function(f){ return !f.done; });

      var e = document.createElement('div');
      e.className = 'empty-state';

  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if (h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function wireForm(type, d){
    document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);

    var exerciseState = (d.exercises && d.exercises.length) ? d.exercises.slice() : (type==='resistance' ? [{name:'',sets:'',reps:'',value:'',unit:'kg'}] : []);
    var pendingPhotoDataUrl = d.photoDataUrl || null;

    if (type === 'padel'){
      var resultVal = d.result || null;
      document.querySelectorAll('#resultToggle button').forEach(function(b){
        b.addEventListener('click', function(){
          resultVal = (resultVal === b.dataset.v) ? null : b.dataset.v;
          document.querySelectorAll('#resultToggle button').forEach(function(x){ x.classList.remove('sel'); });
          if (resultVal) b.classList.add('sel');
        });
      });

      var setState = (d.sets && d.sets.length) ? d.sets.slice() : [{yourGames:'', oppGames:''}];
      var setRowsWrap = document.getElementById('setRows');
      function renderSetRows(){
        setRowsWrap.innerHTML = '';
        setState.forEach(function(st, i){
          var row = document.createElement('div');
          row.className = 'exercise-row';
          row.innerHTML =
            '<input placeholder="Your games" type="number" value="'+(st.yourGames!=null?st.yourGames:'')+'">' +
            '<input placeholder="Opp. games" type="number" value="'+(st.oppGames!=null?st.oppGames:'')+'">' +
            '<button type="button" class="ex-rm">✕</button>';
          var ins = row.querySelectorAll('input');
          ins[0].addEventListener('input', function(){ setState[i].yourGames = ins[0].value; });
          ins[1].addEventListener('input', function(){ setState[i].oppGames = ins[1].value; });
          row.querySelector('.ex-rm').addEventListener('click', function(){ setState.splice(i,1); renderSetRows(); });
          setRowsWrap.appendChild(row);
        });
      }
      renderSetRows();
      document.getElementById('addSetBtn').addEventListener('click', function(){
        setState.push({yourGames:'', oppGames:''});
        renderSetRows();
      });

      var padelTypeSelect = document.getElementById('f_padelType');
      var matchFieldsWrap = document.getElementById('padelMatchFields');
      var playersFieldsWrap = document.getElementById('playersFieldsWrap');
      var addPlayersBtn = document.getElementById('addPlayersBtn');
      var hasPlayers = d.players && d.players.filter(Boolean).length > 0;
      var playersRevealed = hasPlayers; // true only if editing an entry that already has player names
      function syncPadelTypeVisibility(){
        var isMatch = padelTypeSelect.value === 'match';
        matchFieldsWrap.style.display = isMatch ? '' : 'none';
        var showPlayers = isMatch || playersRevealed;
        playersFieldsWrap.style.display = showPlayers ? '' : 'none';
        addPlayersBtn.style.display = showPlayers ? 'none' : '';
      }
      addPlayersBtn.addEventListener('click', function(){
        playersRevealed = true;
        syncPadelTypeVisibility();
      });
      padelTypeSelect.addEventListener('change', syncPadelTypeVisibility);
      syncPadelTypeVisibility();
    }

    if (type === 'nutrition'){
      var dayRatingVal = d.dayRating || null;
      document.querySelectorAll('#dayRatingToggle button').forEach(function(b){
        b.addEventListener('click', function(){
          dayRatingVal = (dayRatingVal === b.dataset.v) ? null : b.dataset.v;
          document.querySelectorAll('#dayRatingToggle button').forEach(function(x){ x.classList.remove('sel'); });
          if (dayRatingVal) b.classList.add('sel');
        });
      });

      var glutenFreeVal = !!d.glutenFree;
      var minimalProcessedVal = !!d.minimalProcessed;
      var sufficientWaterVal = !!d.sufficientWater;
      function wireYesNo(idPrefix, getSet){
        document.querySelectorAll('#' + idPrefix + 'Toggle button').forEach(function(b){
          b.addEventListener('click', function(){
            getSet(b.dataset.v === 'yes');
            document.querySelectorAll('#' + idPrefix + 'Toggle button').forEach(function(x){ x.classList.remove('sel'); });
            b.classList.add('sel');
          });
        });
      }
      wireYesNo('f_glutenFree', function(v){ glutenFreeVal = v; });
      wireYesNo('f_minimalProcessed', function(v){ minimalProcessedVal = v; });
      wireYesNo('f_sufficientWater', function(v){ sufficientWaterVal = v; });
    }

    if (type === 'cardio'){
      var typeSelect = document.getElementById('f_cardioType');
      var newTypeField = document.getElementById('cardioNewTypeField');
      function syncNewTypeVisibility(){
        newTypeField.style.display = (typeSelect.value === '__new__') ? '' : 'none';
      }
      typeSelect.addEventListener('change', syncNewTypeVisibility);
      syncNewTypeVisibility();
    }

    if (type === 'resistance'){
      var rowsWrap = document.getElementById('exerciseRows');
      var dlId = 'exerciseSuggestions';
      if (!document.getElementById(dlId)){
        var dl = document.createElement('datalist');
        dl.id = dlId;
        document.body.appendChild(dl);
      }
      var dlEl = document.getElementById(dlId);
      dlEl.innerHTML = presets.exercises.map(function(e){ return '<option value="'+e.name.replace(/"/g,'&quot;')+'">'; }).join('');

      function renderRows(){
        rowsWrap.innerHTML = '';
        exerciseState.forEach(function(ex, i){
          var row = document.createElement('div');
          row.className = 'exercise-row';
          var unitOptsHtml = UNIT_OPTIONS.map(function(u){ return '<option value="'+u+'"'+(ex.unit===u?' selected':'')+'>'+u+'</option>'; }).join('');
          row.innerHTML =
            '<input class="ex-name" list="'+dlId+'" placeholder="Exercise name" value="'+(ex.name||'').replace(/"/g,'&quot;')+'">' +
            '<input placeholder="Sets" type="number" value="'+(ex.sets||'')+'" style="max-width:56px">' +
            '<input placeholder="Reps" type="number" value="'+(ex.reps||'')+'" style="max-width:56px">' +
            '<input placeholder="Value" type="number" value="'+(ex.value||'')+'" style="max-width:64px">' +
            '<select class="ex-unit">'+unitOptsHtml+'</select>' +

          inputs[0].addEventListener('input', function(){ exerciseState[i].name = inputs[0].value; });
          inputs[1].addEventListener('input', function(){ exerciseState[i].sets = inputs[1].value; });
          inputs[2].addEventListener('input', function(){ exerciseState[i].reps = inputs[2].value; });
          inputs[3].addEventListener('input', function(){ exerciseState[i].value = inputs[3].value; });

        var file = e.target.files[0];
        if (!file) return;
        compressImage(file, 900, 0.65).then(function(dataUrl){
          pendingPhotoDataUrl = dataUrl;
          var wrap = document.getElementById('photoPreviewWrap');
          document.getElementById('photoPreviewImg').src = dataUrl;
          wrap.style.display = '';
        }).catch(function(err){ console.error('photo compress failed', err); });

      document.getElementById('f_photoCamera').addEventListener('change', handlePhotoFile);
      document.getElementById('f_photoGallery').addEventListener('change', handlePhotoFile);

      var notesEl = document.getElementById('f_notes');
      out.notes = notesEl ? notesEl.value : '';

      if (type === 'padel'){
        out.padelType = document.getElementById('f_padelType').value;
        if (out.padelType === 'match'){
          out.result = typeof resultVal !== 'undefined' ? resultVal : (d.result || null);
          out.sets = setState
            .filter(function(st){ return st.yourGames !== '' || st.oppGames !== ''; })
            .map(function(st){ return { yourGames: st.yourGames !== '' ? Number(st.yourGames) : null, oppGames: st.oppGames !== '' ? Number(st.oppGames) : null }; });
        } else {
          out.result = null;
          out.sets = [];
        }
        out.players = [
          document.getElementById('f_player1').value,
          document.getElementById('f_player2').value,
          document.getElementById('f_player3').value,
          document.getElementById('f_player4').value
        ];
        out.venue = document.getElementById('f_venue').value;
        out.durationMin = numOrNull('f_durationMin');
      }
      if (type === 'resistance'){
        var finalExercises = exerciseState.filter(function(e){ return e.name; }).map(function(e){
          return { name: e.name, sets: e.sets ? Number(e.sets) : null, reps: e.reps ? Number(e.reps) : null,
                   value: e.value ? Number(e.value) : null, unit: e.unit || 'kg' };
        });
        out.exercises = finalExercises;
        out.bodyweight = numOrNull('f_bodyweight');
        out.durationMin = numOrNull('f_durationMin');

        // Offer to save any new exercise names as presets
        var knownNames = presets.exercises.map(function(e){ return e.name.toLowerCase(); });
        var newOnes = finalExercises.filter(function(e){ return knownNames.indexOf(e.name.toLowerCase()) === -1; });
        newOnes.forEach(function(e){
          if (confirm('Save "' + e.name + '" (' + e.unit + ') as a new exercise for quick access next time?')){
            presets.exercises.push({ name: e.name, unit: e.unit });
            knownNames.push(e.name.toLowerCase());
          }
        });
        if (newOnes.length) savePresets();
      }
      if (type === 'cardio'){
        var typeSelectEl = document.getElementById('f_cardioType');
        var chosenType = typeSelectEl.value;
        if (chosenType === '__new__'){
          var newName = document.getElementById('f_cardioTypeNew').value.trim();
          if (newName){
            chosenType = newName;
            if (presets.cardioTypes.indexOf(newName) === -1 &&
                confirm('Save "' + newName + '" as a new cardio type for quick access?')){
              presets.cardioTypes.push(newName);
              savePresets();
            }
          } else {
            chosenType = presets.cardioTypes[0];
          }
        }
        out.cardioType = chosenType;
        out.distance = numOrNull('f_distance');
        out.distanceUnit = document.getElementById('f_distanceUnit').value;
        out.durationMin = numOrNull('f_durationMin');
      }
      if (type === 'yoga'){
        out.focus = document.getElementById('f_focus').value;
        out.durationMin = numOrNull('f_durationMin');
      }
      if (type === 'weight'){
        out.weightKg = numOrNull('f_weightKg');
      }
      if (type === 'photo'){
        out.photoDataUrl = pendingPhotoDataUrl || d.photoDataUrl || null;
      }
      if (type === 'nutrition'){
        out.dayRating = typeof dayRatingVal !== 'undefined' ? dayRatingVal : (d.dayRating || null);
        out.glutenFree = glutenFreeVal;
        out.minimalProcessed = minimalProcessedVal;
        out.sufficientWater = sufficientWaterVal;
        out.waterAmount = document.getElementById('f_waterAmount').value;
        out.foodDiary = document.getElementById('f_foodDiary').value;
        out.calories = numOrNull('f_calories');
      }

      saveSession(out);
      closeSheet();
    });

    if (editingId){
      document.getElementById('deleteBtn').addEventListener('click', function(){
        deleteSession(editingId);
        closeSheet();
      });
    }
  }

  function numOrNull(id){
    var el = document.getElementById(id);
    if (!el || el.value === '') return null;
    return Number(el.value);
  }

  function renderAll(){
    renderHeader();
    renderLogView();
    if (currentView === 'calendar') renderCalendar();
    if (currentView === 'stats') renderStats();
    if (currentView === 'focus') renderFocus();
  }

  renderHeader();
  renderAll();
  initDb();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW registration failed', e); });
    });
  }

})();
</script>
</body>
</html>
